# Cada push a main: valida casos y citas del banco, corre el smoke test y
# publica en GitHub Pages. Si algo falla, no se publica y queda la version anterior.
name: Validar y publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar casos y citas del banco
        run: node tools/validate.mjs
      - name: Smoke test de los motores
        run: node tools/smoke.mjs
      - name: Build de un solo archivo (comprueba que empaqueta)
        run: node tools/build.mjs
      - name: Armar el sitio (solo lo que usa la app)
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js cases preguntas icons _site/
          cp dist/medquest.html _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: validar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
