/** quizUI.js — modulo de preguntas del banco. Solo dibuja; la logica esta en quizEngine. */



const LETRAS = ['A', 'B', 'C', 'D', 'E'];
function render(cont, { banco, perfil, ronda, recompensaRonda }, acc) {
  if (!banco) { cont.innerHTML = '<p class="vacio">Cargando preguntas...</p>'; return; }
  if (!ronda) return inicio(cont, banco, perfil, acc);
  if (!preguntaActual(ronda)) return resumen(cont, banco, ronda, recompensaRonda, acc);
  return pregunta(cont, banco, ronda, acc);
}

function inicio(cont, banco, perfil, acc) {
  const st = estadisticasBanco(banco, perfil);
  const porArea = Object.entries(AREAS).filter(([k]) => k !== 'DEMO')
    .map(([k, a]) => ({ k, a, n: banco.preguntas.filter(q => q.area === k).length }))
    .filter(x => x.n);

  cont.innerHTML = `
  <div class="encabezado">
    <h1>Preguntas rápidas</h1>
    <p class="sutil">Rondas de ${PREGUNTAS_POR_RONDA}. Cada respuesta trae la frase exacta de la norma y su página, para que la puedas comprobar en el PDF.</p>
  </div>

  <button class="hero azul" id="ronda" style="margin-bottom:.9rem">
    <span class="burbuja" style="width:9rem;height:9rem;right:-2.5rem;top:-3rem"></span>
    <span class="k">Empezar ronda</span>
    <span class="v">${PREGUNTAS_POR_RONDA} preguntas de todas las áreas, priorizando las que fallaste</span>
    ${decoPregunta()}
  </button>

  <div class="panel">
    <div class="stats">
      <div class="stat"><b>${st.vistas}/${st.total}</b><span>vistas</span></div>
      <div class="stat"><b>${st.pct != null ? st.pct + '%' : '—'}</b><span>aciertos</span></div>
      <div class="stat"><b>${st.dominadas}</b><span>dominadas</span></div>
    </div>
    ${st.pendientes ? `<button class="btn uva ancho" id="falladas" style="margin-top:.8rem">Repasar las ${st.pendientes} que fallaste la última vez</button>` : ''}
  </div>

  <div class="panel">
    <h3>Por área</h3>
    <p class="nota" style="margin:.3rem 0 .7rem">Una ronda solo de esa área.</p>
    <div class="grid-areas">
      ${porArea.map(x => `
        <button class="area-btn ${x.a.color}" data-area="${x.k}">
          <span class="ico" aria-hidden="true">${x.a.ico || ''}</span>${esc(x.a.corto)}<small>${x.n} preguntas</small>
        </button>`).join('')}
    </div>
  </div>

  <p class="nota" style="text-align:center">Las preguntas están en borrador hasta que una persona del área confirme que cada cita respalda la respuesta.</p>`;

  $('#ronda', cont).addEventListener('click', () => acc.empezarRonda({}));
  $('#falladas', cont)?.addEventListener('click', () => acc.empezarRonda({ soloFalladas: true }));
  on(cont, '[data-area]', el => acc.empezarRonda({ area: el.dataset.area }));
}

function pregunta(cont, banco, ronda, acc) {
  const q = preguntaActual(ronda);
  const A = AREAS[q.area] || AREAS.DEMO;
  const respondida = ronda.elegida != null;
  const correctaMostrada = q.orden.indexOf(q.correcta);
  const acerto = respondida && ronda.elegida === correctaMostrada;
  const f = banco.fuentes[q.fuente.id] || {};

  const clases = (i) => {
    if (!respondida) return '';
    if (i === correctaMostrada) return 'correcta';
    if (i === ronda.elegida) return 'incorrecta';
    return 'apagada';
  };

  cont.innerHTML = `
  <div class="progreso" aria-label="Pregunta ${ronda.i + 1} de ${ronda.preguntas.length}">
    ${ronda.preguntas.map((p, i) => {
      const r = ronda.respuestas[i];
      return `<i class="${r ? (r.correcta ? 'ok' : 'no') : i === ronda.i ? 'ahora' : ''}"></i>`;
    }).join('')}
  </div>

  <div class="pregunta ${A.color}">
    <span class="tema">${esc(A.ico || '')} ${esc(q.tema)} · ${ronda.i + 1} de ${ronda.preguntas.length}</span>
    <p class="enunciado">${esc(q.enunciado)}</p>
    ${respondida && acerto ? chispas() : ''}
  </div>

  <div class="opciones">
    ${q.orden.map((orig, i) => `
      <button class="opcion ${clases(i)}" data-op="${i}" ${respondida ? 'disabled' : ''}>
        <span class="letra">${LETRAS[i]}</span><span>${esc(q.opciones[orig])}</span>
      </button>`).join('')}
  </div>

  ${respondida ? `
  <div class="veredicto ${acerto ? 'bien' : 'mal'}">
    <h3>${acerto ? '¡Correcto!' : 'No era esa'}</h3>
    ${acerto ? '' : `<p><strong>Respuesta:</strong> ${esc(q.opciones[q.correcta])}</p>`}
    <p>${esc(q.explicacion)}</p>
    <div class="cita">“${esc(q.fuente.cita)}”
      <span class="de">${esc(f.corto || q.fuente.id)}, página ${q.fuente.pagina}${f.anio ? ` · ${esc(f.anio)}` : ''}${f.url ? ` · <a href="${esc(f.url)}" target="_blank" rel="noopener">ver norma</a>` : ''}</span>
    </div>
  </div>
  <button class="btn pri ancho" id="sig">${ronda.i + 1 < ronda.preguntas.length ? 'Siguiente' : 'Ver resultado'}</button>
  ` : `<p class="nota" style="text-align:center">Elige una opción. Verás al instante si acertaste y lo que dice la norma.</p>`}`;

  on(cont, '[data-op]', el => acc.responderPregunta(+el.dataset.op));
  $('#sig', cont)?.addEventListener('click', () => acc.siguientePregunta());
  $('#sig', cont)?.focus();
}

function resumen(cont, banco, ronda, rec, acc) {
  const r = resumenRonda(ronda);
  const pct = r.total ? Math.round(r.aciertos / r.total * 100) : 0;
  const msg = pct === 100 ? '¡Ronda perfecta!' : pct >= 80 ? '¡Muy bien!' : pct >= 50 ? 'Vas por buen camino' : 'Estas vuelven pronto: así se aprenden';

  cont.innerHTML = `
  <div class="panel" style="margin-top:1rem">
    <div class="puntaje">
      <div class="anillo ${clase(pct)}" style="--p:${pct}"><div><b>${r.aciertos}</b><small>de ${r.total}</small></div></div>
      <div>
        <p class="mensaje" style="margin:0">${msg}</p>
        ${rec ? `<p class="sutil" style="margin:.4rem 0 0">+${rec.total} Kamas Clínicas</p>` : ''}
      </div>
    </div>
  </div>

  ${r.falladas.length ? `
  <div class="panel">
    <h3>Para repasar</h3>
    <ul class="repaso">
      ${r.falladas.map(q => {
        const f = banco.fuentes[q.fuente.id] || {};
        return `<li>
          <div class="pq" style="margin:0 0 .3rem">${esc(q.enunciado)}</div>
          <div class="en">${esc(q.opciones[q.correcta])}</div>
          <div class="fu">“${esc(q.fuente.cita)}” — ${esc(f.corto || q.fuente.id)}, p. ${q.fuente.pagina}</div>
        </li>`;
      }).join('')}
    </ul>
  </div>` : ''}

  <div class="fila" style="margin-bottom:1rem">
    <button class="btn pri" id="otra">Otra ronda</button>
    ${r.falladas.length ? '<button class="btn uva" id="rep">Repetir las falladas</button>' : ''}
    <button class="btn" id="salir">Volver</button>
  </div>`;

  $('#otra', cont).addEventListener('click', () => acc.empezarRonda(ronda.filtro.soloFalladas ? {} : ronda.filtro));
  $('#rep', cont)?.addEventListener('click', () => acc.empezarRonda({ soloFalladas: true }));
  $('#salir', cont).addEventListener('click', () => acc.salirRonda());
}

function chispas() {
  const e = ['✨', '⭐', '🎉', '💫'];
  return `<div class="chispas" aria-hidden="true">${Array.from({ length: 10 }, (_, i) => {
    const a = (i / 10) * Math.PI * 2;
    return `<span style="left:50%;top:55%;--dx:${Math.round(Math.cos(a) * 130)}px;--dy:${Math.round(Math.sin(a) * 70)}px">${e[i % e.length]}</span>`;
  }).join('')}</div>`;
}
function decoPregunta() {
  return `<svg class="deco" viewBox="0 0 120 120" aria-hidden="true">
    <rect x="22" y="14" width="76" height="92" rx="16" fill="rgba(255,255,255,.22)"/>
    <rect x="34" y="30" width="52" height="8" rx="4" fill="#fff"/>
    <rect x="34" y="46" width="40" height="8" rx="4" fill="rgba(255,255,255,.75)"/>
    <circle cx="40" cy="72" r="7" fill="#FFC23D"/><rect x="52" y="68" width="30" height="8" rx="4" fill="rgba(255,255,255,.75)"/>
    <circle cx="40" cy="90" r="7" fill="#fff"/><rect x="52" y="86" width="24" height="8" rx="4" fill="rgba(255,255,255,.75)"/>
  </svg>`;
}


/* ===== js/ui/screens.js ===== */
/** screens.js — inicio, perfil y tienda. */
function renderInicio(cont, { perfil, casos }, acc) {
  const ms = misionesDeHoy(perfil);
  const r = racha(perfil.dias);
  const pend = conceptosPendientes(perfil);
  const medicos = casos.filter(c => c.tipo === 'medico');
  const jugados = medicos.filter(c => perfil.casos[c.id]).length;

  const saludo = r >= 2 ? `Llevas ${r} días seguidos. No la cortes hoy.` : 'No tienes que repasar toda medicina. Tienes que hacer una partida.';
  cont.innerHTML = `
  <div class="encabezado">
    <h1>¿Qué jugamos hoy?</h1>
    <p class="sutil">${saludo}</p>
  </div>

  <div class="heroes">
    <button class="jugar" id="jugar">
      <span class="burbuja" style="width:10rem;height:10rem;right:-3rem;top:-3.5rem"></span>
      <span class="burbuja" style="width:4rem;height:4rem;right:6.5rem;bottom:-1.5rem"></span>
      <span class="k">Caso clínico</span>
      <span class="v">Un paciente, tus decisiones y la defensa ante el tribunal</span>
      <svg class="deco" viewBox="0 0 120 120" aria-hidden="true">
        <path d="M34 20v28a22 22 0 0 0 44 0V20" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
        <path d="M56 70v14a16 16 0 0 0 32 0v-8" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
        <circle cx="88" cy="66" r="11" fill="#FFC23D" stroke="#fff" stroke-width="5"/>
        <circle cx="34" cy="18" r="5" fill="#fff"/><circle cx="78" cy="18" r="5" fill="#fff"/>
      </svg>
    </button>
    <button class="hero azul" id="preguntas">
      <span class="burbuja" style="width:8rem;height:8rem;right:-2.5rem;top:-3rem"></span>
      <span class="k">Preguntas rápidas</span>
      <span class="v">10 preguntas con la cita de la norma</span>
      ${decoPregunta()}
    </button>
  </div>

  <div class="panel">
    <h3>Misiones de hoy</h3>
    ${ms.lista.map(m => `
      <div class="mision">
        <span class="caja ${m.progreso >= m.meta ? 'ok' : ''}"></span>
        <span style="flex:1">${esc(m.texto)}</span>
        <span class="pr">${m.progreso}/${m.meta}</span>
      </div>`).join('')}
    <hr class="hr">
    ${misionesCompletas(ms)
      ? (ms.cobrada
        ? `<p class="nota">Recompensa cobrada. Vuelve mañana.</p>`
        : `<button class="btn pri ancho" id="cobrar">Cobrar ${RECOMPENSA_MISIONES} Kamas</button>`)
      : `<p class="nota">Completa las tres y cobras ${RECOMPENSA_MISIONES} Kamas Clínicas.</p>`}
  </div>

  ${pend.length ? `
  <div class="panel">
    <h3>Repaso pendiente</h3>
    <p class="nota" style="margin:.35rem 0 .2rem">${pend.length} concepto(s) que fallaste y todavía no corregiste.</p>
    <ul class="repaso">${pend.slice(0, 3).map(k => `<li><div class="en">${esc(k.enunciado)}</div></li>`).join('')}</ul>
    <button class="btn uva ancho" id="repaso" style="margin-top:.8rem">Jugar un caso de repaso</button>
  </div>` : ''}

  <div class="panel">
    <h3>Elegir área</h3>
    <p class="nota" style="margin:.3rem 0 .7rem">Un caso de esa área, en vez de dejarlo al azar.</p>
    <div class="grid-areas">
      ${Object.entries(AREAS).filter(([k]) => k !== 'DEMO').map(([k, a]) => {
        const n = medicos.filter(c => c.area === k).length;
        return `<button class="area-btn ${a.color}" data-area="${k}" ${n ? '' : 'disabled'}>
          <span class="ico" aria-hidden="true">${a.ico || ''}</span>${esc(a.corto)}<small>${n ? n + ' caso(s)' : 'pronto'}</small></button>`;
      }).join('')}
    </div>
    <hr class="hr">
    <p class="nota" style="margin-bottom:.55rem">Nivel de atención. Cambia qué estudios tienes y qué espera la norma de ti. Nivel 1 es un centro de salud con internación.</p>
    <div class="fila">
      ${[1, 2, 3].map(n => `<button class="btn sm ${perfil.ajustes.nivelPreferido === n ? 'act' : ''}" data-nivel="${n}">Nivel ${n}</button>`).join('')}
      <button class="btn sm ${!perfil.ajustes.nivelPreferido ? 'act' : ''}" data-nivel="0">Al azar</button>
    </div>
    <hr class="hr">
    <button class="btn sm" id="demo">🧪 Caso de prueba (no médico)</button>
  </div>

  <div class="stats" style="margin-bottom:1rem">
    <div class="stat"><b>${r}</b><span>días de racha</span></div>
    <div class="stat"><b>${jugados}/${medicos.length}</b><span>casos jugados</span></div>
    <div class="stat"><b>${nivel(perfil.kamas + perfil.canjes.reduce((s, c) => s + c.costo, 0))}</b><span>tu nivel</span></div>
  </div>`;

  $('#jugar', cont).addEventListener('click', () => acc.jugar({}));
  $('#repaso', cont)?.addEventListener('click', () => acc.jugar({ soloRepaso: true }));
  $('#demo', cont).addEventListener('click', () => acc.jugar({ demo: true }));
  $('#preguntas', cont).addEventListener('click', () => acc.ir('preguntas'));
  $('#cobrar', cont)?.addEventListener('click', () => acc.cobrarMisiones());
  on(cont, '[data-area]', el => acc.jugar({ area: el.dataset.area }));
  on(cont, '[data-nivel]', el => acc.fijarNivel(+el.dataset.nivel || null));
}
function renderPerfil(cont, { perfil, casos }, acc) {
  const pend = conceptosPendientes(perfil);
  const areas = Object.entries(AREAS).filter(([k]) => k !== 'DEMO').map(([k, a]) => {
    const st = perfil.areas[k] || { partidas: 0, sumaPuntaje: 0 };
    const total = casos.filter(c => c.area === k && c.tipo === 'medico').length;
    const jug = casos.filter(c => c.area === k && perfil.casos[c.id]).length;
    const media = st.partidas ? Math.round(st.sumaPuntaje / st.partidas) : null;
    return { k, a, total, jug, media, partidas: st.partidas };
  });

  cont.innerHTML = `
  <div class="encabezado"><h1>Tu mapa</h1><p class="sutil">Dónde estás fuerte y qué te falta.</p></div>

  <div class="panel">
    <h3>Por area</h3>
    ${areas.map(x => `
      <div class="areaf">
        <span class="pill ${x.a.color}">${x.a.ico || ''} ${esc(x.a.corto)}</span>
        <span class="nm">${x.jug}/${x.total} casos</span>
        <span class="n">${x.media != null ? x.media + '%' : '—'}</span>
      </div>
      <div class="barra"><i class="${x.media != null ? clase(x.media) : ''}" style="width:${x.total ? x.jug / x.total * 100 : 0}%"></i></div>
    `).join('')}
  </div>

  <div class="panel">
    <h3>Conceptos por corregir</h3>
    ${pend.length ? `<ul class="repaso">${pend.map(k => `
      <li><div class="en">${esc(k.enunciado)}</div>
      <div class="pq">Fallado ${k.fallos} vez(ces)${k.pagina ? ` · fuente pp. ${esc(k.pagina)}` : ''}</div></li>`).join('')}</ul>`
      : '<p class="vacio" style="margin-top:.5rem">Nada pendiente.</p>'}
  </div>

  <div class="panel">
    <h3>Ultimas partidas</h3>
    ${perfil.partidas.length ? `<ul class="cuerpo" style="padding-left:1.15rem;margin:.5rem 0 0">
      ${perfil.partidas.slice(-12).reverse().map(p => `<li>${esc(p.fecha)} · ${esc(p.casoId)} · nivel ${p.nivel} · ${p.global}%</li>`).join('')}
    </ul>` : '<p class="vacio" style="margin-top:.5rem">Todavia ninguna.</p>'}
  </div>

  <div class="panel">
    <h3>Tus datos</h3>
    <div class="fila" style="margin-top:.5rem">
      <button class="btn sm" id="exportar">Exportar progreso</button>
      <button class="btn sm" id="tema">Cambiar tema</button>
      <button class="btn sm" id="borrar">Borrar todo</button>
    </div>
    <p class="nota" style="margin-top:.6rem">El progreso se guarda en este navegador. Si cambias de telefono, exporta primero.</p>
  </div>`;

  $('#exportar', cont).addEventListener('click', () => acc.exportar());
  $('#tema', cont).addEventListener('click', () => acc.tema());
  $('#borrar', cont).addEventListener('click', () => acc.borrar());
}
function renderTienda(cont, { perfil }, acc) {
  cont.innerHTML = `
  <div class="encabezado">
    <h1>🪙 ${perfil.kamas} Kamas Clínicas</h1>
    <p class="sutil" style="margin-top:.35rem">Las recompensas las define ella y las paga alguien mas. Eso es lo que les da valor.</p>
  </div>

  <div class="panel">
    <h3>Recompensas</h3>
    ${perfil.premios.length ? perfil.premios.map(p => `
      <div class="premio">
        <span class="nm">${esc(p.nombre)}</span>
        <span class="co">${p.costo}</span>
        <button class="btn sm ${perfil.kamas >= p.costo ? 'pri' : ''}" data-canje="${esc(p.id)}" ${perfil.kamas >= p.costo ? '' : 'disabled'}>Reclamar</button>
        <button class="btn sm" data-borrar="${esc(p.id)}" aria-label="Quitar">×</button>
      </div>`).join('') : '<p class="vacio" style="margin-top:.5rem">Todavia no hay recompensas. Agrega una abajo.</p>'}
    <hr class="hr">
    <div class="fila">
      <input type="text" id="pn" placeholder="Recompensa" style="flex:1 1 9rem">
      <input type="text" id="pc" inputmode="numeric" placeholder="Kamas" style="width:6rem">
      <button class="btn" id="pa">Agregar</button>
    </div>
  </div>

  <div class="panel">
    <h3>Reclamadas</h3>
    ${perfil.canjes.length ? `<ul class="cuerpo" style="padding-left:1.15rem;margin:.5rem 0 0">
      ${perfil.canjes.slice().reverse().map(c => `<li>${esc(c.fecha)} · ${esc(c.nombre)} (${c.costo}) · ${esc(c.estado)}</li>`).join('')}
    </ul>` : '<p class="vacio" style="margin-top:.5rem">Ninguna todavia.</p>'}
    <p class="nota" style="margin-top:.7rem">MedQuest solo registra el reclamo. La entrega ocurre afuera, entre ustedes.</p>
  </div>`;

  on(cont, '[data-canje]', el => acc.canjear(el.dataset.canje));
  on(cont, '[data-borrar]', el => acc.borrarPremio(el.dataset.borrar));
  $('#pa', cont).addEventListener('click', () => {
    const n = $('#pn', cont).value.trim(), c = parseInt($('#pc', cont).value, 10);
    if (n && c > 0) acc.agregarPremio(n, c);
  });
}


/* ===== js/ui/caseUI.js ===== */
/** caseUI.js — pantalla de partida. Solo dibuja; toda la logica esta en caseEngine. */



const ET = { anamnesis: 'Interrogar', antecedentes: 'Antecedentes', examenFisico: 'Examen fisico' };
const PISTA = {
  anamnesis: 'Escribe que le vas a preguntar. No "hago anamnesis": las preguntas concretas.',
  antecedentes: 'Que antecedentes vas a buscar en este paciente y por que.',
  examenFisico: 'Que vas a examinar y que signos estas buscando.'
};
function renderCaso(cont, { caso, partida }, acc) {
  const A = AREAS[caso.area];
  const est = estudiosDisponibles(caso, partida.nivel);
  const porGrupo = {};
  est.forEach(e => { (porGrupo[e.etiquetaGrupo] ||= []).push(e); });

  cont.innerHTML = `
  <div class="panel zona ${A.color}">
    <div class="fila" style="align-items:center">
      <span class="pill ${A.color}">${esc(A.nombre)}</span>
      <span class="pill gris">Nivel ${partida.nivel}</span>
      ${caso.estado !== 'VALIDADO' ? `<span class="pill gris">${esc(caso.estado.replace(/_/g, ' ').toLowerCase())}</span>` : ''}
    </div>
    <h2 style="margin:.6rem 0 .5rem">${esc(caso.titulo)}</h2>
    <p class="clinico" style="margin:0">${esc(caso.presentacionInicial.texto)}</p>
    ${caso.presentacionInicial.signosVitales ? `<table class="sv">${
      Object.entries(caso.presentacionInicial.signosVitales).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')
    }</table>` : ''}
  </div>

  ${GRUPOS_INFO.filter(g => caso.descubrimiento?.[g]).map(g => {
    const grupo = caso.descubrimiento[g];
    const abierto = partida.revelados.includes(g);
    return `
    <div class="panel">
      <h3>${esc(grupo.etiqueta || ET[g])}</h3>
      ${abierto ? `
        <p class="nota" style="margin:.35rem 0 0">Lo que declaraste: ${esc(partida.declaraciones[g] || '')}</p>
        <ul class="hallazgos">${grupo.items.map(it => `<li>${esc(it.texto)}</li>`).join('')}</ul>
      ` : `
        <p class="nota" style="margin:.35rem 0 .55rem">${esc(PISTA[g] || '')}</p>
        <textarea data-decl="${g}" placeholder="...">${esc(partida.declaraciones[g] || '')}</textarea>
        <div class="fila" style="margin-top:.5rem">
          <button class="btn pri" data-revelar="${g}" ${puedeRevelar(caso, partida, g) ? '' : 'disabled'}>Revelar ${esc((ET[g] || g).toLowerCase())}</button>
        </div>
      `}
    </div>`;
  }).join('')}

  <div class="panel">
    <h3>Estudios</h3>
    <p class="nota" style="margin:.35rem 0 .6rem">Solo aparecen resultados que este caso contiene. Lo que pidas queda registrado aunque no haya resultado.</p>
    ${Object.entries(porGrupo).map(([et, items]) => `

    `).join('')}
  </div>

  <div class="panel">
    <h3>Tu conclusion</h3>
    <p class="nota" style="margin:.35rem 0 .7rem">Al cerrar el caso esto queda bloqueado y pasas al tribunal.</p>

    ${campo('diferenciales', 'Diagnosticos diferenciales', partida.diferenciales, 'Uno por vez')}
    ${campo('conductas', 'Conducta y tratamiento', partida.conductas, 'Una medida por vez')}

    <div class="fila">
      <button class="btn pri" id="cerrar" ${partida.diagnosticos.length ? '' : 'disabled'}>Cerrar caso e ir al tribunal</button>
      <button class="btn" id="abandonar">Abandonar</button>
    </div>
    ${partida.diagnosticos.length ? '' : '<p class="nota" style="margin-top:.5rem">Necesitas al menos un diagnostico principal para cerrar.</p>'}
  </div>`;

  // --- eventos ---
  $$('[data-decl]', cont).forEach(t => t.addEventListener('input', () => {
    acc.declarar(t.dataset.decl, t.value);
    const b = $(`[data-revelar="${t.dataset.decl}"]`, cont);
    if (b) b.disabled = t.value.trim().length < 10;
  }));
  on(cont, '[data-revelar]', el => acc.revelar(el.dataset.revelar));
  on(cont, '[data-est]', el => acc.estudio(el.dataset.est));
  $('#pedirlibre', cont)?.addEventListener('click', () => {
    const i = $('#estlibre', cont); if (i.value.trim()) { acc.estudioLibre(i.value); }
  });
  ['diagnosticos', 'diferenciales', 'conductas'].forEach(campoId => {
    const inp = $(`#in_${campoId}`, cont);
    const add = () => { if (inp.value.trim()) acc.proponer(campoId, inp.value); };
    $(`#add_${campoId}`, cont)?.addEventListener('click', add);
    inp?.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); add(); } });
    on(cont, `[data-quitar="${campoId}"]`, el => acc.quitar(campoId, el.dataset.texto));
  });
  $('#cerrar', cont)?.addEventListener('click', () => acc.cerrar());
  $('#abandonar', cont)?.addEventListener('click', () => acc.abandonar());
}

function campo(id, etiqueta, valores, ph) {
  return `

  ${valores.length ? `<div class="chips">${valores.map(v => `

}

function det(titulo, hechos, faltas, verboFalta) {

    ${hechos.length ? `<p>Hiciste:</p><ul>${li(hechos)}</ul>` : ''}

/* ===== js/app.js ===== */

const CE = { crearPartida, declarar, puedeRevelar, revelar, estudiosDisponibles, solicitarEstudio, solicitarEstudioLibre, proponer, quitar, cerrarCaso, normalizar, GRUPOS_INFO, GRUPOS_ESTUDIO };
const TE = { construirInterrogatorio, responder, PESO_AUTOEVAL };
const RE = { GANANCIAS, nivel, racha, recompensar, recompensarRonda, misionesDeHoy, avanzarMisiones, misionesCompletas, RECOMPENSA_MISIONES };
const QZ = { crearRonda, responderPregunta, siguientePregunta, resumenRonda, preguntaActual, estadisticasBanco, pesoPregunta, PREGUNTAS_POR_RONDA };
const QuizUI = { render: renderPreguntas };
const Screens = { renderInicio, renderPerfil, renderTienda };
const CaseUI = { render: renderCaso };
const TribunalUI = { render: renderTribunal };
const ResultsUI = { render: renderResultados };
/**
 * app.js — cableado. Tiene el estado de la sesion y conecta motores con UI.
 *
 * DECISION ARQUITECTONICA
 * Los modulos de UI son funciones puras de render que reciben datos y un objeto
 * de acciones. No importan motores ni tocan el estado. Eso permite reemplazar
 * la capa visual sin tocar la logica, y probar los motores sin DOM.
 */















const S = {
  perfil: null, casos: [], caso: null, partida: null,
  preguntas: [], indice: 0, revelado: false,
  resultado: null, recompensa: null, conceptosPrevios: [],
  pantalla: 'inicio', reloj: null,
  banco: null, ronda: null, recompensaRonda: null,
  borradorTribunal: ''
};

const guardar = () => storage.guardar(S.perfil);

// ---------------- render ----------------
function pintarTop() {
  $('#kc').textContent = `${S.perfil.kamas} KC`;
  const r = RE.racha(S.perfil.dias);
  $('#racha').textContent = r ? `${r} ${r === 1 ? 'día' : 'días'}` : '';
}

function pintar() {
  pintarTop();
  $$('.pantalla').forEach(p => p.classList.toggle('on', p.id === 'p-' + S.pantalla));
  $$('nav.tabs button').forEach(b => {
    if (b.dataset.ir === S.pantalla) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
  $('#reloj-band').style.display = (S.pantalla === 'partida' && S.partida && !S.partida.cerrado) ? '' : 'none';
  window.scrollTo(0, 0);

  const cont = $('#p-' + S.pantalla);
  switch (S.pantalla) {
    case 'inicio':   Screens.renderInicio(cont, S, acc); break;
    case 'perfil':   Screens.renderPerfil(cont, S, acc); break;
    case 'tienda':   Screens.renderTienda(cont, S, acc); break;
    case 'partida':  CaseUI.render(cont, S, acc); break;
    case 'tribunal': TribunalUI.render(cont, S, acc); break;
    case 'resultado': ResultsUI.render(cont, S, acc); break;
    case 'preguntas': QuizUI.render(cont, S, acc); break;
  }
}

function ir(p) { S.pantalla = p; pintar(); }

// ---------------- reloj ----------------
function arrancarReloj() {
  clearInterval(S.reloj);
  const limite = S.caso.tiempoSugeridoSeg || 1800;
  S.reloj = setInterval(() => {
    if (!S.partida || S.partida.cerrado) return clearInterval(S.reloj);
    const t = Math.round((Date.now() - S.partida.inicio) / 1000);
    const resta = limite - t;
    const el = $('#reloj');
    el.textContent = (resta < 0 ? '-' : '') + mmss(Math.abs(resta));
    el.classList.toggle('tarde', resta <= 300 && resta > 0);
    el.classList.toggle('fuera', resta <= 0);
  }, 1000);
}

// ---------------- acciones ----------------
const acc = {
  ir,

  jugar(filtro = {}) {
    let caso;
    if (filtro.demo) caso = S.casos.find(c => c.tipo === 'prueba');
    else caso = elegirCaso(S.casos, S.perfil, filtro);
    if (!caso) return;
    const niveles = caso.nivelesDisponibles || [1, 2, 3];
    let nivel = S.perfil.ajustes.nivelPreferido;
    if (!nivel || !niveles.includes(nivel)) nivel = niveles[Math.floor(Math.random() * niveles.length)];
    S.caso = caso;
    S.partida = CE.crearPartida(caso, nivel);
    S.conceptosPrevios = conceptosPendientes(S.perfil).map(k => k.id);
    S.preguntas = []; S.indice = 0; S.revelado = false; S.resultado = null;
    arrancarReloj();
    ir('partida');
  },

  fijarNivel(n) { S.perfil.ajustes.nivelPreferido = n; guardar(); pintar(); },

  declarar(grupo, texto) { CE.declarar(S.partida, grupo, texto); },
  revelar(grupo) { CE.revelar(S.caso, S.partida, grupo); pintar(); },
  estudio(clave) { CE.solicitarEstudio(S.caso, S.partida, clave); pintar(); },
  estudioLibre(nombre) { CE.solicitarEstudioLibre(S.caso, S.partida, nombre); pintar(); },
  proponer(campo, texto) { CE.proponer(S.partida, campo, texto); pintar(); },
  quitar(campo, texto) { CE.quitar(S.partida, campo, texto); pintar(); },

  abandonar() {
    if (!confirm('Abandonar la partida? No se guarda nada.')) return;
    clearInterval(S.reloj); S.partida = null; S.caso = null; ir('inicio');
  },

  cerrar() {
    if (!confirm('Al cerrar el caso tus decisiones quedan bloqueadas y pasas al tribunal. Seguro?')) return;
    clearInterval(S.reloj);
    CE.cerrarCaso(S.partida);
    S.preguntas = TE.construirInterrogatorio(S.caso, S.partida);
    S.indice = 0; S.revelado = false;
    ir('tribunal');
  },

  borradorTribunal(texto) { S.borradorTribunal = texto; },
  verEsperado() { S.revelado = true; pintar(); },

  responder(pregunta, valor) {
    TE.responder(S.partida, pregunta, valor, S.borradorTribunal);
    S.indice++; S.revelado = false; S.borradorTribunal = '';
    pintar();
  },

  terminarTribunal() {
    const r = evaluar(S.caso, S.partida);
    r.log = S.partida.decisionLog;
    S.resultado = r;

    const rec = RE.recompensar(S.perfil, S.caso, r, S.conceptosPrevios);
    S.recompensa = rec;

    registrarResultado(S.perfil, S.caso, r);
    S.perfil.kamas += rec.total;

    RE.avanzarMisiones(S.perfil, { tipo: 'jugar' });
    if (S.partida.tribunalRespuestas.length) RE.avanzarMisiones(S.perfil, { tipo: 'tribunal' });
    RE.avanzarMisiones(S.perfil, { tipo: 'defender', cantidad: S.partida.tribunalRespuestas.filter(x => x.autoevaluacion === 'completa').length });
    if (rec.corregidos) RE.avanzarMisiones(S.perfil, { tipo: 'repaso', cantidad: rec.corregidos });
    if (S.partida.nivel === 1) RE.avanzarMisiones(S.perfil, { tipo: 'provincia' });
    RE.avanzarMisiones(S.perfil, { tipo: 'debil' });

    S.misiones = RE.misionesDeHoy(S.perfil);
    guardar();
    ir('resultado');
  },

  cobrarMisiones() {
    const ms = RE.misionesDeHoy(S.perfil);
    if (!RE.misionesCompletas(ms) || ms.cobrada) return;
    ms.cobrada = true; S.perfil.kamas += RE.RECOMPENSA_MISIONES;
    guardar(); pintar();
  },

  agregarPremio(nombre, costo) {
    S.perfil.premios.push({ id: 'p' + Date.now(), nombre, costo });
    guardar(); pintar();
  },
  borrarPremio(id) {
    S.perfil.premios = S.perfil.premios.filter(p => p.id !== id);
    guardar(); pintar();
  },
  canjear(id) {
    const p = S.perfil.premios.find(x => x.id === id);
    if (!p || S.perfil.kamas < p.costo) return;
    S.perfil.kamas -= p.costo;
    S.perfil.canjes.push({ nombre: p.nombre, costo: p.costo, fecha: hoy(), estado: 'pendiente de entrega' });
    guardar(); pintar();
  },

  async exportar() {
    const txt = await storage.exportar();
    const blob = new Blob([txt], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `medquest-progreso-${hoy()}.json`;
    a.click(); URL.revokeObjectURL(a.href);
  },
  tema() {
    const actual = document.documentElement.getAttribute('data-theme');
    const nuevo = actual === 'dark' ? 'light' : actual === 'light' ? null : 'dark';
    if (nuevo) document.documentElement.setAttribute('data-theme', nuevo);
    else document.documentElement.removeAttribute('data-theme');
    S.perfil.ajustes.tema = nuevo; guardar();
  },
  async borrar() {
    if (!confirm('Borrar todo el progreso, las Kamas y las recompensas? No se puede deshacer.')) return;
    S.perfil = await storage.borrarTodo();
    ir('inicio');
  },

  // ---------- banco de preguntas ----------
  empezarRonda(filtro = {}) {
    if (!S.banco) return;
    S.ronda = QZ.crearRonda(S.banco, S.perfil, filtro);
    S.recompensaRonda = null;
    if (!S.ronda.preguntas.length) S.ronda = null;
    ir('preguntas');
  },
  responderPregunta(i) {
    if (!S.ronda) return;
    QZ.responderPregunta(S.ronda, S.perfil, i);
    guardar(); pintar();
  },
  siguientePregunta() {
    if (!QZ.siguientePregunta(S.ronda)) {
      const res = QZ.resumenRonda(S.ronda);
      S.recompensaRonda = RE.recompensarRonda(S.perfil, res);
      S.perfil.kamas += S.recompensaRonda.total;
      if (!S.perfil.dias.includes(hoy())) S.perfil.dias.push(hoy());
      RE.avanzarMisiones(S.perfil, { tipo: 'preguntas' });
      guardar();
    }
    pintar();
  },
  salirRonda() { S.ronda = null; S.recompensaRonda = null; ir('preguntas'); },

  otra() { acc.jugar({}); },
  inicio() { ir('inicio'); }
};

// ---------------- arranque ----------------
async function iniciar() {
  S.perfil = await storage.cargar();
  if (S.perfil.ajustes.tema) document.documentElement.setAttribute('data-theme', S.perfil.ajustes.tema);
  if (!S.perfil.premios.length) {
    S.perfil.premios = [
      { id: 'p1', nombre: 'Elegir que jugamos hoy', costo: 300 },
      { id: 'p2', nombre: 'Kamas de Dofus', costo: 1200 },
      { id: 'p3', nombre: 'Skin de League of Legends', costo: 5000 },
      { id: 'p4', nombre: 'Cena', costo: 2500 }
    ];
  }
  S.casos = await cargarTodos();
  try { S.banco = await cargarBanco(); } catch { S.banco = { preguntas: [], fuentes: {} }; }
  S.misiones = RE.misionesDeHoy(S.perfil);
  await guardar();

  $$('nav.tabs button').forEach(b => b.addEventListener('click', () => {
    if (S.partida && !S.partida.cerrado && b.dataset.ir !== 'partida') {
      if (!confirm('Tienes una partida abierta. Salir la abandona.')) return;
      clearInterval(S.reloj); S.partida = null; S.caso = null;
    }
    ir(b.dataset.ir);
  }));

  pintar();
}

// instalable y sin conexion; solo servido por http(s), no en el archivo unico abierto desde disco
if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !window.MEDQUEST_CASOS) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// exportamos el proxy como objeto de acciones para la UI
window.MedQuest = { S, acc };
iniciar();

</script>
