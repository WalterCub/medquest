:"152-153","nivel":[1,2,3],"sinonimos":["informar","explicar a la familia","orientacion","prevencion"]},{"clave":"cx_ringer","texto":"Ringer lactato como solucion de hidratacion. La fuente indica solucion salina isotonica y dice expresamente no usar Ringer lactato","valoracion":"NO_CONTEMPLADO_POR_LA_FUENTE","fuente":0,"pagina":"150","nivel":[1,2,3],"sinonimos":["ringer","ringer lactato","hartmann"],"conceptoLigado":"c_primer_nivel"},{"clave":"cx_hemodialisis","texto":"Hemodialisis. En la tabla de antidotos de la fuente figura como no indicada por el alto volumen de distribucion de los organofosforados","valoracion":"NO_CONTEMPLADO_POR_LA_FUENTE","fuente":0,"pagina":"151","nivel":[1,2,3],"sinonimos":["hemodialisis","dialisis"],"conceptoLigado":"c_atropina"},{"clave":"cx_test_diagnostico","texto":"Prueba de la atropina (1 mg IM y control de FC a los 20 minutos). La fuente la reserva para la duda en la identificacion del caso sospechoso; aqui hay exposicion conocida y toxindrome colinergico evidente","valoracion":"NO_CONTEMPLADO_POR_LA_FUENTE","fuente":0,"pagina":"147-148","nivel":[1,2,3],"sinonimos":["prueba diagnostica","test diagnostico","1 mg im y esperar 20 minutos","prueba terapeutica"],"conceptoLigado":"c_caso_sospechoso"}],"informacionCritica":[{"clave":"producto","texto":"Identificar el toxico responsable: nombre del producto, etiqueta o envase","valoracion":"ESPERADO","fuente":0,"pagina":"145","conceptoLigado":"c_caso_sospechoso"},{"clave":"tiempo","texto":"Tiempo de exposicion: condiciona la gravedad y las medidas para disminuir la absorcion","valoracion":"ESPERADO","fuente":0,"pagina":"143, 150","conceptoLigado":"c_descontaminacion"},{"clave":"via","texto":"Via de exposicion (oral, inhalatoria, dermica): define las medidas de descontaminacion","valoracion":"ESPERADO","fuente":0,"pagina":"143, 150-151","conceptoLigado":"c_descontaminacion"},{"clave":"intencion","texto":"Intencionalidad: todo intento de suicidio requiere interconsulta con psiquiatria o psicologia","valoracion":"ESPERADO","fuente":0,"pagina":"152","conceptoLigado":"c_referencia"},{"clave":"sintomas_gi","texto":"Efectos muscarinicos digestivos: nauseas, vomitos, diarrea, retortijones","valoracion":"ESPERADO","fuente":0,"pagina":"147","conceptoLigado":"c_clinica"},{"clave":"conciencia","texto":"Estado de conciencia: el lavado gastrico solo se realiza si no hay alteracion de la conciencia","valoracion":"ESPERADO","fuente":0,"pagina":"150","conceptoLigado":"c_descontaminacion"},{"clave":"pupilas","texto":"Miosis y lagrimeo, efectos muscarinicos","valoracion":"ESPERADO","fuente":0,"pagina":"147","conceptoLigado":"c_clinica"},{"clave":"secreciones","texto":"Salivacion y sudoracion, efectos muscarinicos","valoracion":"ESPERADO","fuente":0,"pagina":"147","conceptoLigado":"c_clinica"},{"clave":"pulmones","texto":"Broncoespasmo y aumento de secreciones bronquiales; la insuficiencia respiratoria por secreciones es criterio de referencia","valoracion":"ESPERADO","fuente":0,"pagina":"147, 152","conceptoLigado":"c_atropina"},{"clave":"musculos","texto":"Debilidad muscular y fasciculaciones, efectos nicotinicos","valoracion":"ESPERADO","fuente":0,"pagina":"147","conceptoLigado":"c_clinica"}],"conceptosClave":[{"id":"c_mecanismo","enunciado":"Los organofosforados inhiben la acetilcolinesterasa y acumulan acetilcolina en receptores muscarinicos, nicotinicos y en el SNC. La inhibicion puede volverse permanente (envejecimiento); los carbamatos no envejecen y su toxicidad es mas corta y autolimitada.","fuente":0,"pagina":"142-143"},{"id":"c_caso_sospechoso","enunciado":"Caso sospechoso: antecedente de exposicion a organofosforados o carbamatos, cuadro compatible con toxindrome colinergico y, en ciertos casos, examenes complementarios. La prueba de la atropina se reserva para la duda diagnostica y no se hace en asintomaticos.","fuente":0,"pagina":"145, 148"},{"id":"c_clinica","enunciado":"Muscarinicos: nauseas, vomitos, diarrea, sudoracion, salivacion, lagrimeo, miosis, broncoespasmo, secreciones bronquiales, bradicardia, hipotension. Nicotinicos: debilidad, fasciculaciones, taquicardia, hipertension, hiperglucemia. SNC: ansiedad, ataxia, convulsiones, depresion respiratoria, coma.","fuente":0,"pagina":"147"},{"id":"c_primer_nivel","enunciado":"Primer nivel: ABCDE, via aerea permeable, decubito lateral izquierdo, oxigeno humedo, SNG previa atropina si la FC es baja, lavado gastrico si no hay alteracion de conciencia, via venosa con solucion salina isotonica 1000 ml cada 8 horas (no Ringer lactato) y referencia.","fuente":0,"pagina":"150"},{"id":"c_descontaminacion","enunciado":"Descontaminacion segun via: respiratoria, retirar de la atmosfera toxica; conjuntival, irrigar 15 minutos; cutanea, retirar ropa y duchar con agua y jabon; digestiva, lavado gastrico y carbon activado 1 g/kg. El personal usa EPP y guantes por riesgo de contaminacion secundaria.","fuente":0,"pagina":"149-151"},{"id":"c_atropina","enunciado":"Atropina 0.5 a 2 mg EV, duplicando cada 5 a 10 minutos hasta FC mayor o igual a 60, pulmones limpios y SatO2 mayor o igual a 94%. Revierte efectos muscarinicos, no nicotinicos: la taquicardia no la contraindica. Las oximas actuan sobre los nicotinicos y se recomiendan tempranas.","fuente":0,"pagina":"145, 151"},{"id":"c_referencia","enunciado":"Criterios de referencia: sindrome intermedio, insuficiencia respiratoria por obstruccion de via aerea por secreciones, bradicardia severa, probabilidad de paro y compromiso neurologico severo. Todo intento de suicidio requiere interconsulta con psiquiatria o psicologia. Segundo y tercer nivel: hospitalizacion en todos los casos.","fuente":0,"pagina":"150, 152"},{"id":"c_alta","enunciado":"Criterios de alta: signos vitales normales, colinesterasa plasmatica en valores normales, buen estado general fisico y mental y manejo por psiquiatria o psicologia.","fuente":0,"pagina":"152"}]},"tribunal":[{"id":"t01","pregunta":"Diga su diagnostico y con que elementos cumple la definicion de caso sospechoso de la fuente.","disparador":{"tipo":"siempre"},"loQueSeEsperaOir":["Intoxicacion aguda por inhibidor de colinesterasa, organofosforado (clorpirifos)","Antecedente de exposicion con envase identificado","Toxindrome colinergico compatible"],"conceptoLigado":"c_caso_sospechoso","fuente":0},{"id":"t02","pregunta":"Clasifique los signos de este paciente en muscarinicos, nicotinicos y del sistema nervioso central.","disparador":{"tipo":"siempre"},"loQueSeEsperaOir":["Muscarinicos: vomitos, diarrea, sudoracion, salivacion, lagrimeo, miosis, secreciones bronquiales, bradicardia, hipotension","Nicotinicos: fasciculaciones y debilidad muscular; hiperglucemia","SNC: ansiedad"],"conceptoLigado":"c_clinica","fuente":0},{"id":"t03","pregunta":"Esta en un Centro de Salud con Internacion, a dos horas del hospital. Diga en orden lo que hace desde que el paciente cruza la puerta hasta que sale en la ambulancia.","disparador":{"tipo":"siempre"},"loQueSeEsperaOir":["Proteccion del personal con EPP y guantes","ABCDE, via aerea, decubito lateral izquierdo, oxigeno humedo","Retirar la ropa contaminada y lavar la piel","Atropina hasta FC mayor o igual a 60, pulmones limpios y SatO2 mayor o igual a 94%","Via venosa con solucion salina isotonica, no Ringer lactato","SNG y lavado gastrico si esta consciente, con atropina previa si la FC es baja","Referencia"],"conceptoLigado":"c_primer_nivel","fuente":0},{"id":"t04","pregunta":"Indico atropina. Diga la dosis inicial, como la escala y cuales son exactamente las metas para dejar de subir.","disparador":{"tipo":"siConducta","clave":"cx_atropina"},"loQueSeEsperaOir":["0.5 a 2 mg EV STAT","Duplicar la dosis cada 5 a 10 minutos","Meta: FC mayor o igual a 60, pulmones limpios, SatO2 mayor o igual a 94%","La dosis total se mantiene como mantenimiento"],"conceptoLigado":"c_atropina","fuente":0},{"id":"t05","pregunta":"El paciente tiene bradicardia, broncorrea y satura 88%, y usted no indico atropina. Justifique.","disparador":{"tipo":"siNoConducta","clave":"cx_atropina"},"loQueSeEsperaOir":["La atropina es el antidoto de los efectos muscarinicos","Bradicardia y secreciones bronquiales son muscarinicos","Se titula hasta FC mayor o igual a 60, pulmones limpios y SatO2 mayor o igual a 94%"],"conceptoLigado":"c_atropina","fuente":0},{"id":"t06","pregunta":"Durante la atropinizacion el paciente llega a 110 lpm pero sigue con crepitantes difusos. Suspende la atropina? Justifique con la fuente.","disparador":{"tipo":"siempre"},"loQueSeEsperaOir":["No: la meta incluye pulmones limpios y SatO2 mayor o igual a 94%","La atropina revierte efectos muscarinicos, no nicotinicos","La taquicardia no es contraindicacion porque puede ser efecto nicotinico"],"conceptoLigado":"c_atropina","fuente":0},{"id":"t07","pregunta":"Que agrega la oxima a la atropina, y por que la fuente insiste en darla temprano?","disparador":{"tipo":"siempre"},"loQueSeEsperaOir":["La oxima reactiva la AChE y actua sobre los efectos nicotinicos","La atropina solo actua sobre los muscarinicos","La oxima temprana retrasa el envejecimiento de la enzima"],"conceptoLigado":"c_mecanismo","fuente":0},{"id":"t08","pregunta":"Indico lavado gastrico. Con que solucion, que volumen por vez, en que posicion y cual es la condicion para hacerlo?","disparador":{"tipo":"siConducta","clave":"cx_lavado"},"loQueSeEsperaOir":["Solucion salina isotonica","150 a 300 ml por vez en el adulto, hasta liquido claro","Decubito lateral izquierdo en Trendelenburg","Solo si no hay alteracion de la conciencia","Atropina previa a la SNG si la FC es baja"],"conceptoLigado":"c_descontaminacion","fuente":0},{"id":"t09","pregunta":"Eligio Ringer lactato para la via venosa. Que dice la fuente al respecto?","disparador":{"tipo":"siConducta","clave":"cx_ringer"},"loQueSeEsperaOir":["Solucion salina isotonica 1000 ml cada 8 horas","La fuente dice expresamente no usar Ringer lactato"],"conceptoLigado":"c_primer_nivel","fuente":0},{"id":"t10","pregunta":"Propuso hemodialisis. Que dice la fuente sobre su utilidad en esta intoxicacion?","disparador":{"tipo":"siConducta","clave":"cx_hemodialisis"},"loQueSeEsperaOir":["No esta indicada","Por el alto volumen de distribucion de los organofosforados"],"conceptoLigado":"c_atropina","fuente":0},{"id":"t11","pregunta":"Hizo la prueba de la atropina. En que situacion la reserva la fuente, y era este el caso?","disparador":{"tipo":"siConducta","clave":"cx_test_diagnostico"},"loQueSeEsperaOir":["Solo cuando hay duda en la identificacion del caso sospechoso","Aqui hay envase identificado y toxindrome colinergico evidente","No se hace en pacientes asintomaticos"],"conceptoLigado":"c_caso_sospechoso","fuente":0},{"id":"t12","pregunta":"Su camisa esta mojada con el producto. Que hace con eso, y que protege antes de tocarlo?","disparador":{"tipo":"siNoConducta","clave":"cx_descontaminar_piel"},"loQueSeEsperaOir":["Retirar la ropa impregnada","Ducha con agua y jabon, pliegues, detras de las orejas, debajo de las unas","El personal usa EPP y guantes por riesgo de contaminacion secundaria","Hacerlo en ambiente abierto o bien ventilado"],"conceptoLigado":"c_descontaminacion","fuente":0},{"id":"t13","pregunta":"Pidio colinesterasa. Como interpreta la inhibicion de la colinesterasa plasmatica y de la eritrocitaria?","disparador":{"tipo":"siPidio","clave":"colinesterasa"},"loQueSeEsperaOir":["Plasmatica: indicador de exposicion; inhibicion del 50% indica exposicion aguda","Eritrocitaria: mas del 50% intoxicacion moderada, mas del 75% grave","En carbamatos es poco util porque la inhibicion revierte en horas"],"conceptoLigado":"c_caso_sospechoso","fuente":0},{"id":"t14","pregunta":"No pregunto si la ingesta fue intencional. Que conducta obligatoria de la fuente se le escapo?","disparador":{"tipo":"siOmitioInfo","clave":"intencion"},"loQueSeEsperaOir":["Todo intento de suicidio requiere interconsulta con psiquiatria o psicologia","Es ademas un criterio de alta: manejo por psiquiatria o psicologia"],"conceptoLigado":"c_referencia","fuente":0},{"id":"t15","pregunta":"No propuso interconsulta con salud mental. Justifique frente a la fuente.","disparador":{"tipo":"siNoConducta","clave":"cx_psiquiatria"},"loQueSeEsperaOir":["La fuente la exige en todo caso diagnosticado de intento de suicidio"],"conceptoLigado":"c_referencia","fuente":0},{"id":"t16","pregunta":"No evaluo el estado de conciencia antes de decidir la descontaminacion digestiva. Por que era imprescindible?","disparador":{"tipo":"siOmitioInfo","clave":"conciencia"},"loQueSeEsperaOir":["El lavado gastrico y el vomito provocado solo se hacen sin alteracion de la conciencia"],"conceptoLigado":"c_descontaminacion","fuente":0},{"id":"t17","pregunta":"No pidio el nombre del producto ni el envase. Por que la fuente insiste en identificarlo, y debe esperar ese dato para tratar?","disparador":{"tipo":"siOmitioInfo","clave":"producto"},"loQueSeEsperaOir":["Identificar el toxico con nombre, etiqueta o envase","La toxicidad depende del compuesto","La identificacion no debe retrasar las medidas generales ni el antidoto"],"conceptoLigado":"c_caso_sospechoso","fuente":0},{"id":"t18","pregunta":"Estando en primer nivel no propuso referir. Que criterios de referencia de la fuente cumple este paciente?","disparador":{"tipo":"siNoConducta","clave":"cx_referir"},"loQueSeEsperaOir":["Insuficiencia respiratoria por obstruccion de la via aerea por secreciones","Bradicardia","En segundo y tercer nivel se hospitalizan todos los casos"],"conceptoLigado":"c_referencia","fuente":0},{"id":"t19","pregunta":"Cuando le daria el alta a este paciente? Diga los criterios de la fuente.","disparador":{"tipo":"siempre"},"loQueSeEsperaOir":["Signos vitales normales","Colinesterasa plasmatica en valores normales","Buen estado general fisico y mental","Manejo por psiquiatria o psicologia"],"conceptoLigado":"c_alta","fuente":0},{"id":"t20","pregunta":"Que diagnosticos diferenciales da la fuente, y como distingue un organofosforado de un carbamato?","disparador":{"tipo":"siempre"},"loQueSeEsperaOir":["Tetanos","Neuropatia central y periferica","Carbamato: sin envejecimiento, menos efectos sobre el SNC, toxicidad mas corta y autolimitada"],"conceptoLigado":"c_mecanismo","fuente":0}],"fuentes":[{"institucion":"Estado Plurinacional de Bolivia. Ministerio de Salud y Deportes. Direccion General de Redes de Servicios de Salud, Unidad de Redes de Servicios de Salud y Calidad, Area del Continuo","documento":"Norma Nacional de Atencion Clinica de Urgencias y Emergencias. Serie: Documentos Tecnico Normativos No. 543. La Paz: Industrias Graficas Platinium. 300 p. Deposito legal 4-1-743-2025 P.O.","anio":"2025","publicacion":"543","resolucion":"RM 0456 de 30 de septiembre de 2025","capitulo":"16. Intoxicacion Aguda por Inhibidor de Colinesterasa (CIE-10 T60.0). Nivel de atencion I - II - III","pagina":"142-153","url":"https://www.minsalud.gob.bo/8850-norma-nacional-de-atencion-clinica-nnac","consultado":"2026-09-22"},{"institucion":"Estado Plurinacional de Bolivia. Ministerio de Salud y Deportes. Direccion General de Servicios de Salud, Unidad de Redes de Servicios de Salud y Calidad","documento":"Norma Nacional de Caracterizacion de Establecimientos de Salud de Primer Nivel. 2da edicion. Serie: Documentos Tecnico Normativos No. 284. La Paz: Talleres Graficos Tupac Katari. 240 p.","anio":"2013","publicacion":"284","capitulo":"Cap. II, Cuadro No 5 Caracteristicas generales (pp. 35-40); Cap. IV Centro de Salud con Internacion, equipamiento (pp. 119-121); Cap. VI Centro de Salud Integral (p. 204)","pagina":"35-40, 119-121, 204","url":"https://www.minsalud.gob.bo/images/Documentacion/redes_salud/Inivelseguro.pdf","consultado":"2026-09-22"},{"institucion":"Estado Plurinacional de Bolivia. Ministerio de Salud y Deportes. Unidad de Redes de Servicios de Salud y Calidad","documento":"Norma Nacional de Caracterizacion de Hospitales de Segundo Nivel. Serie: Documentos Tecnico Normativos No. 285. La Paz.","anio":"2014","publicacion":"285","capitulo":"Cap. IV Caracterizacion General del Hospital de Segundo Nivel","pagina":"77, 102","url":"https://www.minsalud.gob.bo/images/Documentacion/redes_salud/CAP-4.pdf","consultado":"2026-09-22"}]}];
window.MEDQUEST_BANCO = {"preguntas":[{"id":"MI-AS-01","area":"MI","tema":"Asma bronquial","enunciado":"En la espirometría con prueba broncodilatadora, ¿qué resultado considera la norma como respuesta positiva?","opciones":["Aumento del FEV1 de 12% o más y de 200 ml o más respecto al basal","Aumento del FEV1 de 20% o más y de 400 ml o más respecto al basal","Aumento del FEV1 de 10% o más, sin importar el volumen","Caída del FEV1 de 20% o más tras el broncodilatador"],"correcta":0,"explicacion":"La prueba es positiva si el FEV1 sube al menos 12% y al menos 200 ml. La caída de 20% corresponde a la prueba de broncoconstricción con metacolina.","fuente":{"id":"nnac-mi","pagina":45,"cita":"Es considerada como respuesta positiva un aumento del FEC1 ≥12% y ≥ 200 ml respecto al valor basal tras la administración de broncodilatadores"},"estado":"BORRADOR"},{"id":"MI-AS-02","area":"MI","tema":"Asma bronquial","enunciado":"¿Qué resultado de la prueba de broncoconstricción con metacolina apoya el diagnóstico de asma?","opciones":["Aumento del FEV1 de 12%","Caída del FEV1 de 20% o más","Caída del FEV1 de 5%","Variabilidad del PEF menor a 10%"],"correcta":1,"explicacion":"Con metacolina se busca una caída del FEV1 de 20% o más (15% o más si se usa hiperventilación).","fuente":{"id":"nnac-mi","pagina":45,"cita":"Prueba broncoconstricción: Caída del FEV1 ≥ 20% tras administrar metacolina o ≥ 15% si se utiliza hiperventilación"},"estado":"BORRADOR"},{"id":"MI-AS-03","area":"MI","tema":"Asma bronquial","enunciado":"En la crisis asmática leve, ¿cómo indica la norma el salbutamol?","opciones":["2 inhalaciones con cámara espaciadora cada 20 minutos durante una hora","Nebulización continua por 4 horas","2 inhalaciones cada 8 horas por 7 días","Salbutamol intravenoso en infusión"],"correcta":0,"explicacion":"Crisis leve (II y III nivel): salbutamol 2 inhalaciones en cámara espaciadora cada 20 minutos durante una hora; si no responde, se sigue el esquema de crisis moderada.","fuente":{"id":"nnac-mi","pagina":49,"cita":"Salbutamol 2 inhalaciones en cámara espaciadora cada 20 minutos durante una hora"},"estado":"BORRADOR"},{"id":"MI-AS-04","area":"MI","tema":"Asma bronquial","enunciado":"¿En qué situación indica la norma sulfato de magnesio en el asma?","opciones":["En toda crisis moderada, desde el primer nivel","En la crisis grave, solo en exacerbación severa sin respuesta a la terapia previa","Como tratamiento de mantenimiento del escalón 3","Antes del salbutamol, en toda crisis"],"correcta":1,"explicacion":"Crisis grave, tercer nivel: 2 g IV en 20 minutos, solo en exacerbación severa si no hubo respuesta a la terapia previa.","fuente":{"id":"nnac-mi","pagina":50,"cita":"Sulfato de Magnesio 2 g en Infusión intravenoso en 20 minutos, este sólo en exacerbación severa si no hubo respuesta a terapia previa"},"estado":"BORRADOR"},{"id":"MI-AS-05","area":"MI","tema":"Asma bronquial","enunciado":"Una paciente asmática está en tratamiento del escalón 3. Según los criterios de referencia, ¿a dónde se refiere?","opciones":["A tercer nivel","No se refiere: se maneja en primer nivel","A segundo nivel","A terapia intensiva"],"correcta":2,"explicacion":"Escalón 3: referir a II nivel. Escalones 4, 5 o 6: referir a III nivel.","fuente":{"id":"nnac-mi","pagina":51,"cita":"Paciente con tratamiento en escalón 3 referir a II nivel de atención. En escalón 4 o 5 o 6 referir a III nivel"},"estado":"BORRADOR"},{"id":"MI-AS-06","area":"MI","tema":"Asma bronquial","enunciado":"Una paciente asmática está embarazada. ¿Qué dice la norma sobre su referencia?","opciones":["Referir a III nivel","Referir a II nivel","Solo referir si tiene crisis grave","Manejo en primer nivel con control mensual"],"correcta":0,"explicacion":"El embarazo figura entre los criterios de referencia del asma: referir a III nivel.","fuente":{"id":"nnac-mi","pagina":51,"cita":"Crisis asmática. Estatus asmático. Embarazo referir a III nivel"},"estado":"BORRADOR"},{"id":"MI-AS-07","area":"MI","tema":"Asma bronquial","enunciado":"¿Qué valor de función pulmonar usa la norma como criterio de alta médica en el asma?","opciones":["PEF o VEF1 mayor a 50%","PEF o VEF1 mayor a 70% o normal","PEF o VEF1 mayor a 90%","No usa función pulmonar, solo la clínica"],"correcta":1,"explicacion":"Criterios de alta: resolución o mejoría significativa de los síntomas, PEF o VEF1 mayor a 70% o normal, y ausencia de disnea significativa.","fuente":{"id":"nnac-mi","pagina":51,"cita":"Resolución o mejoría significativa de los síntomas de exacerbación. PEF o VEF1 > 70% o normal"},"estado":"BORRADOR"},{"id":"MI-AS-08","area":"MI","tema":"Asma bronquial","enunciado":"¿Cuál es la primera medida de prevención que lista la norma para el asma?","opciones":["Vacuna antineumocócica","Plan educativo mínimo que incluya comprobación de la técnica de inhalación","Espirometría anual","Corticoide oral en temporada de frío"],"correcta":1,"explicacion":"La primera medida es un plan educativo mínimo con comprobación de la técnica de inhalación; después, dejar de fumar y controlar las exposiciones ambientales.","fuente":{"id":"nnac-mi","pagina":51,"cita":"Plan educativo mínimo que incluya comprobación de la técnica de inhalación"},"estado":"BORRADOR"},{"id":"MI-NA-01","area":"MI","tema":"Neumonía adquirida en la comunidad","enunciado":"Según la norma, ¿con qué puede confirmarse el diagnóstico de neumonía?","opciones":["Con hemograma con leucocitosis","Con una radiografía de tórax que muestra una nueva sombra que no se debe a ninguna otra causa","Con procalcitonina elevada","Con cultivo de esputo positivo"],"correcta":1,"explicacion":"El diagnóstico se basa en síntomas y signos de infección respiratoria baja aguda y puede confirmarse con una radiografía de tórax con una sombra nueva sin otra causa.","fuente":{"id":"nnac-mi","pagina":201,"cita":"puede confirmarse mediante una radiografía de tórax que muestra una nueva sombra que no se debe a ninguna otra causa"},"estado":"BORRADOR"},{"id":"MI-NA-02","area":"MI","tema":"Neumonía adquirida en la comunidad","enunciado":"Un paciente con neumonía tiene CURB-65 de 2. ¿Qué indica la norma?","opciones":["Bajo riesgo: tratamiento ambulatorio","Riesgo intermedio: considerar la posibilidad de ingreso hospitalario","Alto riesgo: terapia intensiva obligatoria","Repetir el puntaje en 72 horas antes de decidir"],"correcta":1,"explicacion":"Grupo 1 (0-1): ambulatorio. Grupo 2 (2): riesgo intermedio, considerar ingreso. Grupo 3 (3 o más): ingreso y posible cuidado intensivo.","fuente":{"id":"nnac-mi","pagina":203,"cita":"Grupo 2 (CURB-65 de 2). Riesgo Intermedio y se debería considerar la posibilidad de ingreso hospitalario"},"estado":"BORRADOR"},{"id":"MI-NA-03","area":"MI","tema":"Neumonía adquirida en la comunidad","enunciado":"En el CURB-65, ¿qué valor de urea suma un punto?","opciones":["Mayor de 20 mg/dl","Mayor de 44 mg/dl (o BUN mayor de 19 mg/dl)","Mayor de 100 mg/dl","Cualquier valor fuera del rango normal del laboratorio"],"correcta":1,"explicacion":"U: urea mayor de 44 mg/dl o BUN mayor de 19 mg/dl. La norma advierte no confundir BUN con urea: urea = BUN x 2.146.","fuente":{"id":"nnac-mi","pagina":203,"cita":"U: Urea (mayor de 44 mg/dl o BUN mayor 19 mg / dl)"},"estado":"BORRADOR"},{"id":"MI-NA-04","area":"MI","tema":"Neumonía adquirida en la comunidad","enunciado":"Neumonía en paciente ambulatorio sin comorbilidad. ¿Cuál es el antibiótico de elección en la norma?","opciones":["Ceftriaxona IV 1 g cada 24 horas","Amoxicilina VO 1 g cada ocho horas por siete días","Ciprofloxacina VO 500 mg cada 12 horas","Levofloxacina VO por 14 días"],"correcta":1,"explicacion":"Ambulatorio sin comorbilidad: amoxicilina VO 1 g cada 8 horas por 7 días. Alternativa: azitromicina o claritromicina.","fuente":{"id":"nnac-mi","pagina":205,"cita":"Amoxicilina VO 1 g cada ocho horas por siete días"},"estado":"BORRADOR"},{"id":"MI-NA-05","area":"MI","tema":"Neumonía adquirida en la comunidad","enunciado":"¿Cuál de estos es un criterio de referencia de la neumonía adquirida en la comunidad según la norma?","opciones":["Fiebre mayor a 38 °C","Saturación de O2 baja","Tos productiva","Edad mayor de 40 años"],"correcta":1,"explicacion":"Criterios de referencia: alteraciones hemodinámicas, saturación de O2 baja y sintomatología persistente al tratamiento ambulatorio.","fuente":{"id":"nnac-mi","pagina":206,"cita":"Alteraciones hemodinámicas. Saturación de O2 baja. Sintomatología persistente al tratamiento ambulatorio"},"estado":"BORRADOR"},{"id":"MI-NA-06","area":"MI","tema":"Neumonía adquirida en la comunidad","enunciado":"¿A quién recomienda la norma la vacuna antineumocócica como prevención de la neumonía?","opciones":["A todos los adultos sanos","A mayores de 65 años y personas con comorbilidades","Solo a menores de 5 años","Solo a pacientes con VIH"],"correcta":1,"explicacion":"Se recomienda vacunación antigripal, contra COVID 19 y antineumocócica en mayores de 65 años y con comorbilidades.","fuente":{"id":"nnac-mi","pagina":206,"cita":"Vacunación antigripal para Influenza, COVID 19 y vacuna antineumocócica en mayores de 65 años y con comorbilidades"},"estado":"BORRADOR"},{"id":"MI-HT-01","area":"MI","tema":"Hipertensión arterial","enunciado":"¿Cómo define la norma la hipertensión arterial?","opciones":["PA mayor o igual a 130/80 mmHg en una sola toma","PA sistólica mayor o igual a 140 mmHg o diastólica mayor o igual a 90 mmHg, sin causa reversible","PA sistólica mayor o igual a 160 mmHg","PA mayor o igual a 120/80 mmHg"],"correcta":1,"explicacion":"HTA: PAS mayor o igual a 140 o PAD mayor o igual a 90 mmHg en ausencia de una causa reversible, como dolor o consumo de sustancias.","fuente":{"id":"nnac-mi","pagina":143,"cita":"presión arterial (PA) de la sangre es mayor o igual a 140 mmHg (PA Sistólica) o mayor o igual a 90 mmHg (PA diastólica)"},"estado":"BORRADOR"},{"id":"MI-HT-02","area":"MI","tema":"Hipertensión arterial","enunciado":"Para confirmar el diagnóstico de hipertensión, ¿cuánto deben estar separados los dos registros de PA?","opciones":["Al menos 24 horas","Al menos siete días","Al menos tres meses","No hace falta un segundo registro"],"correcta":1,"explicacion":"El diagnóstico se establece con dos registros separados por al menos siete días. Si la PAS supera 160 mmHg, se trata sin esperar la segunda medición.","fuente":{"id":"nnac-mi","pagina":146,"cita":"El diagnóstico se establece si en dos registros de PA separados por al menos siete días"},"estado":"BORRADOR"},{"id":"MI-HT-03","area":"MI","tema":"Hipertensión arterial","enunciado":"Paciente hipertenso con diabetes (alto riesgo). ¿A partir de qué PA sistólica se inicia la medicación antihipertensiva?","opciones":["PAS 130 mmHg o más","PAS 140 mmHg o más","PAS 160 mmHg o más","PAS 120 mmHg o más"],"correcta":0,"explicacion":"Alto riesgo (ECV establecida, diabetes o ERC): iniciar si la PAS es de 130 mmHg o más, con objetivo menor a 130.","fuente":{"id":"nnac-mi","pagina":148,"cita":"Inicie medicación antihipertensiva si la PAS ≥ 130 mmHg"},"estado":"BORRADOR"},{"id":"MI-HT-04","area":"MI","tema":"Hipertensión arterial","enunciado":"En el esquema 1 de la vía clínica de hipertensión, ¿cuál es la dosis inicial?","opciones":["Enalapril 10 mg/día","Losartán 50 mg/día + hidroclorotiazida 12,5 mg/día por 1 mes y reevaluar","Amlodipina 10 mg/día","Losartán 100 mg/día + amlodipina 10 mg/día"],"correcta":1,"explicacion":"Esquema 1: iniciar con losartán 50 mg + hidroclorotiazida 12,5 mg y subir por pasos mensuales. Si sigue fuera de meta, se remite a especialidad.","fuente":{"id":"nnac-mi","pagina":148,"cita":"Dosis inicial: Losartán 50mg/día + hidroclorotiazida 12,5 mg/día por 1 mes y reevaluar"},"estado":"BORRADOR"},{"id":"MI-HT-05","area":"MI","tema":"Hipertensión arterial","enunciado":"¿Cuánta sal al día recomienda la norma a un paciente hipertenso?","opciones":["Menos de 5 g al día","Menos de 10 g al día","Nada de sal","Menos de 2 g de sodio por comida"],"correcta":0,"explicacion":"Menos de 5 g de sal al día (aproximadamente una cucharadita rasa), incluida la de los alimentos procesados.","fuente":{"id":"nnac-mi","pagina":148,"cita":"Consumo menor de 5 g de sal al día (aproximadamente una cucharadita rasa)"},"estado":"BORRADOR"},{"id":"MI-HT-06","area":"MI","tema":"Hipertensión arterial","enunciado":"Midió la PA en ambos brazos y son distintas. ¿Cuál usa para las evaluaciones siguientes?","opciones":["El promedio de ambos","El brazo derecho, siempre","El que presente la lectura más elevada","El que presente la lectura más baja"],"correcta":2,"explicacion":"Se usa el brazo con la lectura más elevada y se registra en la historia clínica cuál fue.","fuente":{"id":"nnac-mi","pagina":146,"cita":"utilizando para las evaluaciones posteriores aquel que presente la lectura más elevada"},"estado":"BORRADOR"},{"id":"CX-RD-01","area":"CX","tema":"Fractura distal del radio","enunciado":"¿Qué mecanismo produce la fractura de Colles, la más frecuente del radio distal?","opciones":["Caída con la muñeca en flexión","Caída con la muñeca en extensión","Compresión axial del semilunar","Avulsión ligamentosa por torsión"],"correcta":1,"explicacion":"Colles: caída con la muñeca en extensión. Smith (Colles invertido): con la muñeca en flexión.","fuente":{"id":"nnac-tra","pagina":59,"cita":"Fractura de Colles: Es la más frecuente. Se produce por una caída con la muñeca en extensión"},"estado":"BORRADOR"},{"id":"CX-RD-02","area":"CX","tema":"Fractura distal del radio","enunciado":"¿Qué es la fractura de Smith?","opciones":["Intraarticular por cizallamiento","Extraarticular, por caída con la muñeca en flexión (Colles invertido)","Fractura de la estiloides radial","Fractura por compresión axial del semilunar"],"correcta":1,"explicacion":"Smith o Colles invertido: extraarticular, por caída con la muñeca en flexión.","fuente":{"id":"nnac-tra","pagina":59,"cita":"Smith (Colles invertido): Extraarticular que se produce como consecuencia de una caída con la muñeca en flexión"},"estado":"BORRADOR"},{"id":"CX-RD-03","area":"CX","tema":"Fractura distal del radio","enunciado":"¿Cuál es la prueba de imagen inicial de elección para diagnosticar una fractura distal del radio?","opciones":["Tomografía computarizada","Resonancia magnética","Radiografía simple","Ecografía"],"correcta":2,"explicacion":"La radiografía simple (AP y lateral de muñeca) es la de elección. La tomografía ayuda en fracturas intraarticulares y para planificar la cirugía.","fuente":{"id":"nnac-tra","pagina":59,"cita":"la radiografía simple sigue siendo la prueba de imagen inicial de elección para el diagnóstico"},"estado":"BORRADOR"},{"id":"CX-RD-04","area":"CX","tema":"Fractura distal del radio","enunciado":"En primer nivel, ante una fractura distal del radio cerrada, ¿qué indica la norma?","opciones":["Reducción cerrada y yeso por 6 semanas","Inmovilización y referencia a II o III nivel","Antibiótico en dosis única y referencia","Vendaje y control en 1 semana"],"correcta":1,"explicacion":"Fractura cerrada en primer nivel: inmovilización y referencia. El antibiótico previo a la referencia es solo para la fractura expuesta.","fuente":{"id":"nnac-tra","pagina":60,"cita":"En fractura cerrada, Inmovilización y referencia a nivel II ó III"},"estado":"BORRADOR"},{"id":"CX-RD-05","area":"CX","tema":"Fractura distal del radio","enunciado":"Fractura distal de radio no desplazada, tratada con yeso. ¿Cuánto tiempo indica la norma?","opciones":["2 a 3 semanas","6 a 8 semanas","12 semanas","Hasta que no duela"],"correcta":1,"explicacion":"Yeso o férula durante 6 a 8 semanas y después fisioterapia.","fuente":{"id":"nnac-tra","pagina":60,"cita":"El yeso o la férula deberán usarse durante 6 a 8 semanas y posteriormente el paciente necesitará fisioterapia"},"estado":"BORRADOR"},{"id":"CX-RD-06","area":"CX","tema":"Fractura distal del radio","enunciado":"¿Cuál de estos NO figura entre los criterios de referencia de la fractura distal del radio?","opciones":["Fractura expuesta","Fractura desplazada","Lesiones neurovasculares asociadas","Paciente mayor de 50 años"],"correcta":3,"explicacion":"Criterios de referencia: tratamiento quirúrgico, fractura expuesta, inestable, desplazada o con lesiones neurovasculares asociadas. La edad no figura.","fuente":{"id":"nnac-tra","pagina":61,"cita":"Para tratamiento quirúrgico, en fractura expuesta, inestable, desplazada o acompañada de lesiones asociadas neurovasculares"},"estado":"BORRADOR"},{"id":"CX-RD-07","area":"CX","tema":"Fractura distal del radio","enunciado":"En la clasificación Müller-AO de la fractura distal del radio, ¿qué es el tipo B?","opciones":["Extraarticular","Intraarticular parcial","Intraarticular completa","Fractura expuesta"],"correcta":1,"explicacion":"Tipo A: extraarticular. Tipo B: intraarticular parcial. Tipo C: intraarticular completa.","fuente":{"id":"nnac-tra","pagina":58,"cita":"tipo A extraarticulares, tipo B intraarticulares parciales y tipo C intraarticulares completas"},"estado":"BORRADOR"},{"id":"MI-OF-01","area":"MI","tema":"Intoxicación por organofosforados","enunciado":"Durante la atropinización por intoxicación con organofosforados, ¿cuáles son las metas para dejar de subir la dosis?","opciones":["FC mayor o igual a 60, pulmones limpios y SatO2 mayor o igual a 94%","Midriasis y piel seca","FC mayor a 120 lpm","Desaparición de las fasciculaciones"],"correcta":0,"explicacion":"Se duplica la dosis cada 5 a 10 minutos hasta FC de 60 o más, pulmones limpios y SatO2 de 94% o más. Las fasciculaciones son nicotínicas: la atropina no las revierte.","fuente":{"id":"nnac-urg","pagina":151,"cita":"hasta conseguir que la FC sea mayor igual a 60 latidos por minuto, pulmones limpios y SatO2 mayor igual a 94%"},"estado":"BORRADOR"},{"id":"MI-OF-02","area":"MI","tema":"Intoxicación por organofosforados","enunciado":"¿Sobre qué síntomas actúan principalmente las oximas (pralidoxima)?","opciones":["Muscarínicos","Nicotínicos","Solo sobre el sistema nervioso central","Sobre ninguno: solo evitan el envejecimiento"],"correcta":1,"explicacion":"Las oximas actúan principalmente sobre los síntomas nicotínicos; los muscarínicos se controlan con atropina.","fuente":{"id":"nnac-urg","pagina":145,"cita":"Las oximas, tienen un efecto principalmente sobre los síntomas nicotínicos"},"estado":"BORRADOR"},{"id":"MI-OF-03","area":"MI","tema":"Intoxicación por organofosforados","enunciado":"En primer nivel, ¿con qué solución se canaliza la vía venosa en la intoxicación por organofosforados?","opciones":["Ringer lactato 1000 ml cada 8 horas","Solución salina isotónica 1000 ml cada ocho horas","Dextrosa al 5%","Solución glucosalina"],"correcta":1,"explicacion":"Solución salina isotónica 1000 ml cada 8 horas. La norma dice expresamente no usar Ringer lactato.","fuente":{"id":"nnac-urg","pagina":150,"cita":"inicialmente solución salina isotónica 1000 ml cada ocho horas; no usar Ringer lactato"},"estado":"BORRADOR"},{"id":"MI-OF-04","area":"MI","tema":"Intoxicación por organofosforados","enunciado":"Intoxicación por organofosforado en un intento de suicidio. ¿Qué exige la norma además del tratamiento?","opciones":["Denuncia a instancias judiciales","Interconsulta con psiquiatría o psicología","Alta con cita en 30 días","Solo informar a la familia"],"correcta":1,"explicacion":"Todo caso requiere interconsulta con psiquiatría o psicología si es intento de suicidio. La denuncia judicial corresponde al intento de homicidio.","fuente":{"id":"nnac-urg","pagina":152,"cita":"Todo caso diagnosticado requiere interconsulta con psiquiatría o psicología (intento de suicidio)"},"estado":"BORRADOR"},{"id":"MI-OF-05","area":"MI","tema":"Intoxicación por organofosforados","enunciado":"¿Qué inhibición de la colinesterasa eritrocitaria es compatible con intoxicación grave?","opciones":["Mayor al 25%","Mayor al 50%","Mayor al 75%","Cualquier inhibición"],"correcta":2,"explicacion":"Inhibición mayor del 50%: intoxicación aguda moderada. Mayor al 75%: intoxicación grave.","fuente":{"id":"nnac-urg","pagina":149,"cita":"una inhibición mayor al 75% es compatible con una intoxicación grave"},"estado":"BORRADOR"},{"id":"MI-OF-06","area":"MI","tema":"Intoxicación por organofosforados","enunciado":"En la prueba de la atropina (1 mg IM y esperar 20 minutos), ¿cuándo se considera positiva para intoxicación por inhibidores de colinesterasa?","opciones":["Si la FC sube 50% del valor basal","Si la FC no cambia respecto al valor basal","Si aparece midriasis","Si baja la PA"],"correcta":1,"explicacion":"Si la FC no cambia, es positiva. Si sube 50%, es negativa. No se hace en pacientes asintomáticos.","fuente":{"id":"nnac-urg","pagina":148,"cita":"Si la FC no cambia con respecto al valor basal registrado con antelación a la prueba, se considera la respuesta POSITIVA"},"estado":"BORRADOR"},{"id":"MI-OF-07","area":"MI","tema":"Intoxicación por organofosforados","enunciado":"¿Qué dosis de carbón activado indica la norma para disminuir la absorción del tóxico?","opciones":["1 g/kg VO diluido en 100 ml de agua","10 g/kg VO","50 g en dosis única en todos los casos","0,1 g/kg VO"],"correcta":0,"explicacion":"Carbón activado VO 1 g/kg diluido en 100 ml de agua.","fuente":{"id":"nnac-urg","pagina":151,"cita":"Adsorción del tóxico con carbón activado VO 1 g/Kg. diluido en 100 ml de agua"},"estado":"BORRADOR"},{"id":"MI-AN-01","area":"MI","tema":"Choque anafiláctico","enunciado":"¿Cuál es la droga de elección en el choque anafiláctico?","opciones":["Hidrocortisona","Clorfeniramina","Adrenalina","Salbutamol"],"correcta":2,"explicacion":"La adrenalina es la droga de elección y la más eficaz; retrasarla empeora el pronóstico. Antihistamínicos y corticoides son de segunda línea.","fuente":{"id":"nnac-urg","pagina":52,"cita":"Es la droga de elección y la más eficaz en el tratamiento, retardar su administración influye negativamente el pronóstico"},"estado":"BORRADOR"},{"id":"MI-AN-02","area":"MI","tema":"Choque anafiláctico","enunciado":"Si no hay compromiso vascular grave, ¿dónde se aplica la adrenalina intramuscular y cuánta  choque anafiláctico?","opciones":["Sentado a 90°","Horizontal con las piernas elevadas","Decúbito prono","De pie para favorecer la respiración"],"correcta":1,"explicacion":"Posición horizontal con las piernas elevadas, para aumentar el flujo de sangre al corazón y al cerebro.","fuente":{"id":"nnac-urg","pagina":51,"cita":"Mantener a la persona en posición horizontal y elevar sus piernas para aumentar el flujo de sangre al corazón y al cerebro"},"estado":"BORRADOR"},{"id":"PED-DI-01","area":"PED","tema":"Diarrea persistente","enunciado":"¿Qué duración define a la diarrea persistente según la norma?","opciones":["3 días o más","7 días o más","14 días o más","30 días o más"],"correcta":2,"explicacion":"Disminución de la consistencia de las deposiciones con aumento de la frecuencia y duración de 14 días o más.","fuente":{"id":"nnac-ped","pagina":59,"cita":"Disminución de la consistencia de las deposiciones con aumento de su frecuencia y duración de 14 días o más"},"estado":"BORRADOR"},{"id":"PED-DI-02","area":"PED","tema":"Diarrea persistente","enunciado":"Diarrea persistente sin deshidratación. ¿Por cuánto tiempo se indica zinc?","opciones":["3 días","7 días","10 días","14 días"],"correcta":3,"explicacion":"Dar vitamina A y zinc por 14 días, además de consejería de alimentación, lactancia y seguimiento.","fuente":{"id":"nnac-ped","pagina":60,"cita":"Dar vitamina A. Dar zinc por 14 días"},"estado":"BORRADOR"},{"id":"PED-DI-03","area":"PED","tema":"Diarrea persistente","enunciado":"Niño con diarrea persistente sin deshidratación. ¿Cuándo debe volver a control, aunque esté bien?","opciones":["En 48 horas","Cinco días después","En un mes","Solo si empeora"],"correcta":1,"explicacion":"Seguimiento a los cinco días; antes, si aparecen signos de alarma.","fuente":{"id":"nnac-ped","pagina":60,"cita":"Hacer seguimiento cinco días después"},"estado":"BORRADOR"},{"id":"PED-DI-04","area":"PED","tema":"Diarrea persistente","enunciado":"¿Qué dice la norma sobre los antibióticos en <script type="module">

/* ===== js/services/storage.js ===== */
/**
 * storage.js — unica puerta de salida de datos persistentes.
 *
 * DECISION ARQUITECTONICA
 * Ningun otro modulo toca localStorage directamente. Toda lectura y escritura
 * pasa por aqui, con una firma asincrona aunque hoy sea sincrona. Cuando se
 * migre a Supabase solo cambia este archivo: el resto del codigo ya hace await.
 *
 * El perfil tiene version. Si mas adelante cambia la forma de los datos, se
 * agrega una migracion en migrar() y no se pierde el progreso.
 */

const CLAVE = 'medquest.perfil.v1';
const VERSION = 1;

const perfilVacio = () => ({
  version: VERSION,
  kamas: 0,
  dias: [],                 // 'YYYY-MM-DD' con actividad
  partidas: [],             // resumen por partida cerrada
  casos: {},                // casoId -> { veces, ultima, mejorPuntaje, ultimoPuntaje }
  conceptos: {},            // conceptoId -> { fallos, aciertos, ultima, enunciado, casoId }
  areas: {},                // area -> { partidas, sumaPuntaje }
  misiones: { fecha: null, lista: [], cobrada: false },
  premios: [],              // { id, nombre, costo }
  canjes: [],               // { nombre, costo, fecha, estado }
  preguntas: {},            // preguntaId -> { aciertos, fallos, racha, ultima } (banco)
  ajustes: { nivelPreferido: null, tema: null }
});

function migrar(p) {
  if (!p || typeof p !== 'object') return perfilVacio();
  // Sin migraciones todavia. Al cambiar VERSION, encadenar aqui.
  return Object.assign(perfilVacio(), p, { version: VERSION });
}

let cache = null;
const storage = {
  async cargar() {
    if (cache) return cache;
    let bruto = null;
    try { bruto = JSON.parse(localStorage.getItem(CLAVE)); } catch { bruto = null; }
    cache = migrar(bruto);
    return cache;
  },

  async guardar(perfil) {
    cache = perfil;
    try { localStorage.setItem(CLAVE, JSON.stringify(perfil)); return true; }
    catch { return false; }   // cuota llena o almacenamiento bloqueado: la partida sigue en memoria
  },

  async borrarTodo() {
    cache = null;
    try { localStorage.removeItem(CLAVE); } catch {}
    return this.cargar();
  },

  async exportar() {
    const p = await this.cargar();
    return JSON.stringify(p, null, 2);
  },

  async importar(texto) {
    const p = migrar(JSON.parse(texto));
    await this.guardar(p);
    return p;
  }
};
const hoy = () => new Date().toLocaleDateString('sv');   // YYYY-MM-DD local


/* ===== js/services/caseRepository.js ===== */
/**
 * caseRepository.js — de donde salen los casos.
 *
 * DECISION ARQUITECTONICA
 * Los casos viven en /cases como JSON y NUNCA dentro del codigo. Este modulo
 * es el unico que sabe de donde se cargan. Hoy hay dos origenes:
 *   - window.MEDQUEST_CASOS, que usa la version empaquetada de un solo archivo
 *   - fetch a /cases/*.json, que usa la version modular servida por http
 * Cuando los casos pasen a Supabase solo cambia cargarTodos().
 */
const AREAS = {
  MI:   { nombre: 'Medicina Interna',        corto: 'Interna',   color: 'mi',   ico: '🫀' },
  CX:   { nombre: 'Cirugia',                 corto: 'Cirugia',   color: 'cx',   ico: '🦴' },

  DEMO: { nombre: 'Caso de prueba',          corto: 'Prueba',    color: 'demo', ico: '🧪' }
};

let cacheCasos = null;
async function cargarTodos() {
  if (cacheCasos) return cacheCasos;
  if (typeof window !== 'undefined' && window.MEDQUEST_CASOS) {
    cacheCasos = window.MEDQUEST_CASOS.slice();
    return cacheCasos;
  }
  const indice = await fetch('cases/index.json').then(r => r.json());
  cacheCasos = await Promise.all(indice.casos.map(id => fetch(`cases/${id}.json`).then(r => r.json())));
  return cacheCasos;
}

/** Solo los casos que pueden usarse para evaluar de verdad. */
function jugablesEnExamen(casos) {
  return casos.filter(c => c.tipo === 'medico' && c.estado !== 'BORRADOR');
}
function porId(casos, id) {
  return casos.find(c => c.id === id) || null;
}

/**
 * bancoRepository.js — de donde salen las preguntas del banco.
 *
 * Igual que caseRepository: en la version de un solo archivo vienen en
 * window.MEDQUEST_BANCO; en la version modular se leen de /preguntas.
 */

let cacheBanco = null;
async function cargarBanco() {

/* ===== js/engine/caseEngine.js ===== */
/**
 * caseEngine.js — el estado de una partida y las acciones que lo modifican.
 *
 * DECISIONES ARQUITECTONICAS
 *
 * 1. NO SIMULA CONSECUENCIAS. No existe aqui ninguna funcion que produzca una
 *    evolucion del paciente. El motor solo revela lo que el caso ya contiene.
 *    Si un dato no esta en el JSON, la respuesta es "no hay resultado", nunca
 *    un resultado inventado. Esta restriccion es estructural, no una convencion:
 *    el motor no tiene acceso a nada con lo que pudiera inventar.
 *
 * 2. DECLARAR ANTES DE REVELAR. Unica desviacion respecto del documento de
 *    especificacion, y esta anotada en el README. El documento decia que al
 *    pulsar "Interrogar" aparecen los antecedentes. Eso entrena reconocimiento
 *    (elegir de un menu) cuando el examen evalua evocacion (generar las
 *    preguntas). Aqui la jugadora escribe primero que iba a preguntar o buscar,
 *    su texto queda en el DecisionLog, y recien entonces se revela el grupo.
 *    Los estudios si son menu, porque pedir un estudio de una lista sí es lo
 *    que se hace en la realidad.
 *
 * 3. El DecisionLog es append-only y es la fuente de verdad de lo que hizo la
 *    jugadora. El tribunal y la evaluacion no leen la UI: leen el log.
 */
const GRUPOS_INFO = ['anamnesis', 'antecedentes', 'examenFisico'];
const GRUPOS_ESTUDIO = ['laboratorio', 'gabinete', 'otrosEstudios'];
function crearPartida(caso, nivel = 1) {
  return {
    casoId: caso.id,
    nivel,
    inicio: Date.now(),
    finCaso: null,
    tiempoCasoSeg: 0,
    declaraciones: {},          // grupo -> texto que escribio antes de revelar
    revelados: [],              // grupos revelados
    infoDescubierta: [],        // claves de items de info efectivamente vistos
    estudiosSolicitados: [],    // { clave, nombre, resultado, origen }
    estudiosSinResultado: [],   // { nombre, preguntaTribunal? }
    diagnosticos: [],
    diferenciales: [],
    conductas: [],
    decisionLog: [],
    tribunalRespuestas: [],     // { id, pregunta, autoevaluacion, conceptoLigado }
    cerrado: false,
    resultado: null
  };
}

function registrar(p, tipo, accion, extra = {}) {
  p.decisionLog.push({
    momento: Math.round((Date.now() - p.inicio) / 1000),
    tipo, accion, ...extra
  });
}

/** Guarda lo que la jugadora dice que va a buscar. Sin esto no se revela nada. */
function declarar(p, grupo, texto) {
  p.declaraciones[grupo] = (texto || '').trim();
  registrar(p, 'declaracion', grupo, { texto: p.declaraciones[grupo] });
  return true;
}
function puedeRevelar(caso, p, grupo) {
  const g = caso.descubrimiento?.[grupo];
  if (!g) return false;
  if (g.exigeDeclaracionPrevia === false) return true;
  return (p.declaraciones[grupo] || '').length >= 10;
}

/** Revela un grupo de informacion. Devuelve solo lo que el caso ya contenia. */
function revelar(caso, p, grupo) {
  const g = caso.descubrimiento?.[grupo];
  if (!g) return { ok: false, motivo: 'Este caso no contiene ese grupo de informacion.' };
  if (!puedeRevelar(caso, p, grupo)) {
    return { ok: false, motivo: 'Primero escribe que ibas a buscar en este grupo.' };
  }
  if (!p.revelados.includes(grupo)) {
    p.revelados.push(grupo);
    g.items.forEach(it => { if (!p.infoDescubierta.includes(it.clave)) p.infoDescubierta.push(it.clave); });
    registrar(p, 'informacion', grupo, { items: g.items.length });
  }
  return { ok: true, items: g.items };
}

/** Estudios disponibles para el nivel de atencion en que se juega. */
function estudiosDisponibles(caso, nivel) {
  const out = [];
  for (const g of GRUPOS_ESTUDIO) {
    const grupo = caso.descubrimiento?.[g];
    if (!grupo) continue;
    for (const it of grupo.items || []) {
      out.push({
        ...it,
        grupo: g,
        etiquetaGrupo: grupo.etiqueta || g,
        bloqueadoPorNivel: (it.nivelMinimo || 1) > nivel
      });
    }
  }
  return out;
}

/**
 * Solicita un estudio. Tres desenlaces posibles, ninguno inventa nada:
 *  - existe y el nivel lo permite: devuelve el resultado guardado en el caso
 *  - existe pero el nivel no lo permite: lo dice, y queda registrado
 *  - no existe en el caso: "no evaluable con la fuente disponible"
 */
function solicitarEstudio(caso, p, clave) {
  const todos = estudiosDisponibles(caso, p.nivel);
  const e = todos.find(x => x.clave === clave);
  if (!e) return { ok: false, motivo: 'No existe ese estudio en este caso.' };

  if (p.estudiosSolicitados.some(x => x.clave === clave)) {
    return { ok: true, repetido: true, resultado: p.estudiosSolicitados.find(x => x.clave === clave).resultado };
  }
  registrar(p, 'estudio', e.nombre, { clave, nivel: p.nivel });

  if (e.bloqueadoPorNivel) {
    const r = `No disponible en nivel ${p.nivel}. Este estudio requiere nivel ${e.nivelMinimo} o superior.`
      + (e.nivelNota ? ` ${e.nivelNota}` : '');
    p.estudiosSolicitados.push({ clave, nombre: e.nombre, resultado: r, origen: 'bloqueado' });
    return { ok: true, bloqueado: true, resultado: r };
  }
  p.estudiosSolicitados.push({ clave, nombre: e.nombre, resultado: e.resultado, origen: 'caso' });
  return { ok: true, resultado: e.resultado };
}

/** Estudio plausible que el caso no contempla: no es error, genera pregunta. */
function solicitarEstudioLibre(caso, p, nombre) {
  const n = (nombre || '').trim();
  if (!n) return { ok: false };
  const previsto = (caso.estudiosPlausiblesNoIncluidos || [])
    .find(x => normalizar(x.nombre).includes(normalizar(n)) || normalizar(n).includes(normalizar(x.nombre)));
  registrar(p, 'estudio_libre', n);
  p.estudiosSinResultado.push({
    nombre: n,
    preguntaTribunal: previsto?.preguntaTribunal || null,
    comentarioFuente: previsto?.comentarioFuente || null
  });
  return {
    ok: true,
    resultado: 'No existen resultados disponibles para este estudio en este caso.',
    nota: previsto?.comentarioFuente || 'Queda registrada tu decision. No se evalua como error.'
  };
}
function proponer(p, campo, texto) {
  const t = (texto || '').trim();
  if (!t) return false;
  const lista = p[campo];
  if (lista.includes(t)) return false;
  lista.push(t);
  registrar(p, campo === 'diagnosticos' ? 'diagnostico' : campo === 'diferenciales' ? 'diferencial' : 'tratamiento', t);
  return true;
}
function quitar(p, campo, texto) {
  p[campo] = p[campo].filter(x => x !== texto);
}
function cerrarCaso(p) {
  if (p.cerrado) return p;
  p.cerrado = true;
  p.finCaso = Date.now();
  p.tiempoCasoSeg = Math.round((p.finCaso - p.inicio) / 1000);
  registrar(p, 'cierre', 'Caso cerrado. Decisiones bloqueadas.');
  return p;
}
function normalizar(s) {
  return String(s || '')
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9\s]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}


/* ===== js/engine/scoringEngine.js ===== */
/**
 * scoringEngine.js — evaluacion trazable a rubrica y fuente.
 *
 * DECISIONES ARQUITECTONICAS
 *
 * 1. Nada se marca "incorrecto" por no estar en la base. Una accion que el caso
 *    no contempla se reporta como NO_EVALUABLE y no resta. Lo unico que baja el
 *    puntaje es no haber hecho lo que la fuente marca como ESPERADO.
 *
 * 2. Cinco dimensiones, no nueve. Una pantalla de resultados con nueve barras
 *    no se lee. El detalle sigue disponible por item.
 *
 * 3. Todo hallazgo lleva el indice de fuente y la pagina que venian en la
 *    rubrica, para que la pantalla de resultados pueda mostrar de donde sale.
 */

/** Un texto libre coincide con un item de rubrica si contiene alguno de sus sinonimos. */
function coincide(textoLibre, item) {
  const t = normalizar(textoLibre);
  if (!t) return false;
  const candidatos = [item.clave, ...(item.sinonimos || [])].map(normalizar).filter(Boolean);
  return candidatos.some(c => c.length >= 3 && (t.includes(c) || c.includes(t)));
}

function evaluarLista(propuestas, itemsRubrica) {
  const items = itemsRubrica || [];
  const acertados = [];
  const faltantes = [];
  const usados = new Set();

  for (const item of items) {
    const hit = propuestas.find(p => coincide(p, item));
    if (hit) { acertados.push({ ...item, dicho: hit }); usados.add(hit); }
    else faltantes.push(item);
  }
  const noEvaluables = propuestas.filter(p => !usados.has(p));
  return { acertados, faltantes, noEvaluables };
}

const soloEsperados = (arr) => arr.filter(x => x.valoracion === 'ESPERADO');

function razon(acertados, universo) {
  const total = universo.length;
  if (!total) return { pct: 100, n: 0, total: 0 };
  const n = acertados.filter(a => a.valoracion === 'ESPERADO').length;
  return { pct: Math.round(n / total * 100), n, total };
}
function evaluar(caso, p) {
  const R = caso.rubrica;
  const nivel = p.nivel;

  // --- 1. Informacion obtenida ---
  const criticas = R.informacionCritica || [];
  const vistas = new Set(p.infoDescubierta);
  const infoAcertada = criticas.filter(i => vistas.has(i.clave));
  const infoFaltante = criticas.filter(i => !vistas.has(i.clave));
  const dInfo = razon(infoAcertada, soloEsperados(criticas));

  // --- 2. Diagnostico ---
  const dx = evaluarLista(p.diagnosticos, R.diagnosticosEsperados);
  const dDx = razon(dx.acertados, soloEsperados(R.diagnosticosEsperados));

  // --- 3. Diferenciales ---
  const dd = evaluarLista(p.diferenciales, R.diagnosticosDiferenciales);
  const dDd = razon(dd.acertados, soloEsperados(R.diagnosticosDiferenciales));

  // --- 4. Estudios (solo los que existen en el nivel en que se jugo) ---
  const pedidos = p.estudiosSolicitados.filter(e => e.origen === 'caso').map(e => e.clave);
  const nivelMinimo = new Map();
  for (const g of ['laboratorio', 'gabinete', 'otrosEstudios']) {
    for (const it of caso.descubrimiento?.[g]?.items || []) nivelMinimo.set(it.clave, it.nivelMinimo || 1);
  }
  const estudiosRub = (R.estudios || []).filter(e => (nivelMinimo.get(e.clave) || 1) <= nivel);
  const estAcertados = estudiosRub.filter(e => pedidos.includes(e.clave));
  const estFaltantes = estudiosRub.filter(e => !pedidos.includes(e.clave) && e.valoracion === 'ESPERADO');
  const estNoContemplados = estAcertados.filter(e => e.valoracion === 'NO_CONTEMPLADO_POR_LA_FUENTE');
  const dEst = razon(estAcertados, soloEsperados(estudiosRub));

  // --- 5. Conducta (filtrada por el nivel en que se jugo) ---
  const conductasNivel = (R.conductas || []).filter(c => !c.nivel || c.nivel.includes(nivel));
  const cx = evaluarLista(p.conductas, conductasNivel);
  const cxNoContempladas = cx.acertados.filter(c => c.valoracion === 'NO_CONTEMPLADO_POR_LA_FUENTE');
  const dCx = razon(cx.acertados, soloEsperados(conductasNivel));

  // --- 6. Tribunal ---
  const PESO = { completa: 1, parcial: 0.5, no_supe: 0 };
  const rt = p.tribunalRespuestas;
  const sumaT = rt.reduce((s, r) => s + (PESO[r.autoevaluacion] ?? 0), 0);
  const dTri = { pct: rt.length ? Math.round(sumaT / rt.length * 100) : 0, n: Math.round(sumaT * 10) / 10, total: rt.length };

  const dimensiones = [
    { id: 'info',   etiqueta: 'Informacion obtenida', ...dInfo },
    { id: 'dx',     etiqueta: 'Diagnostico',          ...dDx },
    { id: 'dd',     etiqueta: 'Diferenciales',        ...dDd },
    { id: 'est',    etiqueta: 'Estudios',             ...dEst },
    { id: 'cx',     etiqueta: 'Conducta',             ...dCx },
    { id: 'tri',    etiqueta: 'Tribunal',             ...dTri }
  ];
  const global = Math.round(dimensiones.reduce((s, d) => s + d.pct, 0) / dimensiones.length);

  // --- conceptos para repasar ---
  const mapa = new Map();
  const sumar = (id, motivo) => {
    if (!id) return;
    const k = (R.conceptosClave || []).find(c => c.id === id);
    if (!k) return;
    if (!mapa.has(id)) mapa.set(id, { ...k, motivos: [] });
    mapa.get(id).motivos.push(motivo);
  };
  infoFaltante.forEach(i => sumar(i.conceptoLigado, `No buscaste: ${i.texto}`));
  dx.faltantes.filter(x => x.valoracion === 'ESPERADO').forEach(i => sumar(i.conceptoLigado, `Diagnostico no planteado: ${i.texto}`));
  dd.faltantes.filter(x => x.valoracion === 'ESPERADO').forEach(i => sumar(i.conceptoLigado, `Diferencial no considerado: ${i.texto}`));
  estFaltantes.forEach(i => sumar(i.conceptoLigado, `Estudio no solicitado: ${i.texto}`));
  cx.faltantes.filter(x => x.valoracion === 'ESPERADO').forEach(i => sumar(i.conceptoLigado, `Conducta no propuesta: ${i.texto}`));
  rt.filter(r => r.autoevaluacion !== 'completa').forEach(r => sumar(r.conceptoLigado, `En el tribunal: ${r.pregunta}`));

  const conceptosRepaso = [...mapa.values()];
  const dominados = (R.conceptosClave || []).filter(k => !mapa.has(k.id));

  return {
    casoId: caso.id, area: caso.area, nivel, global, dimensiones,
    tiempoSeg: p.tiempoCasoSeg,
    detalle: {
      info: { acertados: infoAcertada, faltantes: infoFaltante },
      dx, dd,
      estudios: { acertados: estAcertados, faltantes: estFaltantes, noContemplados: estNoContemplados, sinResultado: p.estudiosSinResultado },
      conductas: { ...cx, noContempladas: cxNoContempladas }
    },
    conceptosRepaso, dominados,
    fuentes: caso.fuentes
  };
}


/* ===== js/engine/tribunalEngine.js ===== */
/**
 * tribunalEngine.js — el jefe final. Determinista.
 *
 * DECISION ARQUITECTONICA
 * No hay IA aqui. Las preguntas ya estan escritas en el caso y este modulo solo
 * decide cuales se disparan leyendo el DecisionLog. Eso significa que el
 * tribunal nunca puede preguntar algo que no este respaldado por la fuente, y
 * que dos partidas identicas producen el mismo examen oral.
 *
 * Cuando se agregue el tribunal con IA (v0.4), entra como capa de repregunta
 * NO PUNTUADA sobre estas mismas preguntas. La nota siempre sale de aqui.
 */


/** Devuelve la lista ordenada de preguntas que corresponden a esta partida. */
function construirInterrogatorio(caso, p) {
  const pedidos = new Set(p.estudiosSolicitados.filter(e => e.origen === 'caso').map(e => e.clave));
  const infoVista = new Set(p.infoDescubierta);

  const dxAcertado = (clave) => {
    const item = [...(caso.rubrica.diagnosticosEsperados || []), ...(caso.rubrica.diagnosticosDiferenciales || [])]
      .find(d => d.clave === clave);
    if (!item) return false;
    return [...p.diagnosticos, ...p.diferenciales].some(t => coincide(t, item));
  };
  const conductaPropuesta = (clave) => {
    const item = (caso.rubrica.conductas || []).find(d => d.clave === clave);
    if (!item) return false;
    return p.conductas.some(t => coincide(t, item));
  };

  const aplica = (d) => {
    switch (d.tipo) {
      case 'siempre':          return true;
      case 'siPidio':          return pedidos.has(d.clave);
      case 'siNoPidio':        return !pedidos.has(d.clave);
      case 'siDiagnostico':    return dxAcertado(d.clave);
      case 'siNoDiagnostico':  return !dxAcertado(d.clave);
      case 'siConducta':       return conductaPropuesta(d.clave);
      case 'siNoConducta':     return !conductaPropuesta(d.clave);
      case 'siOmitioInfo':     return !infoVista.has(d.clave);
      default:                 return false;
    }
  };

  const base = (caso.tribunal || [])
    .filter(q => aplica(q.disparador || {}))
    .map(q => ({
      id: q.id,
      pregunta: q.pregunta,
      esperado: q.loQueSeEsperaOir || [],
      conceptoLigado: q.conceptoLigado || null,
      fuente: q.fuente ?? null,
      origen: q.disparador.tipo === 'siempre' ? 'nucleo' : 'decision'
    }));

  // Estudios que pidio y el caso no contempla: no son error, son repregunta.
  const libres = p.estudiosSinResultado
    .filter(e => e.preguntaTribunal)
    .map((e, i) => ({
      id: 'libre_' + i,
      pregunta: e.preguntaTribunal,
      esperado: [],
      conceptoLigado: null,
      fuente: null,
      origen: 'no_contemplado',
      nota: e.comentarioFuente || null
    }));

  // Primero las del nucleo, en el orden del caso; despues las derivadas de sus
  // decisiones; al final las de estudios no contemplados.
  return [
    ...base.filter(q => q.origen === 'nucleo'),
    ...base.filter(q => q.origen === 'decision'),
    ...libres
  ];
}

/**
 * Registra la autoevaluacion de una respuesta.
 * valor: 'completa' | 'parcial' | 'no_supe'
 * La jugadora se califica despues de ver loQueSeEsperaOir. Es deliberado:
 * un matcher de texto no puede juzgar una respuesta oral, y fingir que si
 * puede seria peor que pedirle honestidad.
 */
function responder(p, pregunta, valor, texto = '') {
  const previa = p.tribunalRespuestas.find(r => r.id === pregunta.id);
  const reg = {
    id: pregunta.id,
    pregunta: pregunta.pregunta,
    autoevaluacion: valor,
    texto: String(texto || '').trim() || null,
    conceptoLigado: pregunta.conceptoLigado,
    origen: pregunta.origen
  };
  if (previa) Object.assign(previa, reg);
  else p.tribunalRespuestas.push(reg);
  p.decisionLog.push({
    momento: Math.round((Date.now() - p.inicio) / 1000),
    tipo: 'tribunal', accion: pregunta.id, valor
  });
}
const PESO_AUTOEVAL = { completa: 1, parcial: 0.5, no_supe: 0 };


/* ===== js/engine/learningEngine.js ===== */
/**
 * learningEngine.js — que le conviene practicar ahora.
 *
 * DECISION ARQUITECTONICA
 * La seleccion se siente aleatoria para la jugadora pero esta sesgada hacia lo
 * que le falta. Los pesos son los del documento de especificacion. Se calculan
 * sobre el perfil persistido, no sobre la sesion, para que el sesgo sobreviva
 * al cierre de la app.
 */

const DIA = 86400000;
const dias = (iso) => iso ? Math.floor((Date.now() - new Date(iso + 'T00:00:00').getTime()) / DIA) : 999;
function pesoDeCaso(caso, perfil) {
  const r = perfil.casos[caso.id];
  let w = 1;
  if (!r) w *= 3;                                   // nunca jugado
  else {
    if (r.mejorPuntaje < 60) w *= 5;                // fallado antes
    else if (r.mejorPuntaje >= 85) w *= 0.7;        // dominado
    const d = dias(r.ultima);
    if (d <= 2) w *= 0.2;                           // jugado recien
    else if (d >= 14) w *= 2;                       // hace mucho que no sale
  }
  const a = perfil.areas[caso.area];
  if (a && a.partidas > 0) {
    const media = a.sumaPuntaje / a.partidas;
    if (media < 60) w *= 4;                         // area debil
  }
  // repaso pendiente: algun concepto de este caso esta fallado
  const idsConceptos = (caso.rubrica?.conceptosClave || []).map(k => k.id);
  const pendientes = idsConceptos.filter(id => {
    const c = perfil.conceptos[id];
    return c && c.fallos > c.aciertos;
  });
  if (pendientes.length) w *= 4;
  return Math.max(0.05, w);
}
function elegirCaso(casos, perfil, filtro = {}) {
  let pool = casos.filter(c => filtro.incluirPrueba ? true : c.tipo === 'medico');
  if (filtro.area) pool = pool.filter(c => c.area === filtro.area);
  if (filtro.dificultad) pool = pool.filter(c => c.dificultad === filtro.dificultad);
  if (filtro.soloRepaso) {
    pool = pool.filter(c => (c.rubrica?.conceptosClave || []).some(k => {
      const x = perfil.conceptos[k.id]; return x && x.fallos > x.aciertos;
    }));
  }
  if (!pool.length) pool = casos.filter(c => c.tipo === 'medico');
  if (!pool.length) pool = casos.slice();

  const pesos = pool.map(c => pesoDeCaso(c, perfil));
  const total = pesos.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < pool.length; i++) { r -= pesos[i]; if (r <= 0) return pool[i]; }
  return pool[pool.length - 1];
}

/** Registra el resultado de una partida en el perfil. Muta y devuelve el perfil. */
function registrarResultado(perfil, caso, resultado) {
  const f = hoy();
  if (!perfil.dias.includes(f)) { perfil.dias.push(f); perfil.dias.sort(); }

  const r = perfil.casos[caso.id] || { veces: 0, mejorPuntaje: 0 };
  r.veces++; r.ultima = f; r.ultimoPuntaje = resultado.global;
  r.mejorPuntaje = Math.max(r.mejorPuntaje || 0, resultado.global);
  perfil.casos[caso.id] = r;

  const a = perfil.areas[caso.area] || { partidas: 0, sumaPuntaje: 0 };
  a.partidas++; a.sumaPuntaje += resultado.global;
  perfil.areas[caso.area] = a;

  for (const k of resultado.conceptosRepaso) {
    const c = perfil.conceptos[k.id] || { fallos: 0, aciertos: 0 };
    c.fallos++; c.ultima = f; c.enunciado = k.enunciado; c.casoId = caso.id;
    c.pagina = k.pagina || null;
    perfil.conceptos[k.id] = c;
  }
  for (const k of resultado.dominados) {
    const c = perfil.conceptos[k.id];
    if (c) { c.aciertos++; c.ultima = f; }            // solo cuenta si ya lo habia fallado
  }

  perfil.partidas.push({
    casoId: caso.id, area: caso.area, nivel: resultado.nivel,
    global: resultado.global, fecha: f, tiempoSeg: resultado.tiempoSeg
  });
  if (perfil.partidas.length > 200) perfil.partidas = perfil.partidas.slice(-200);
  return perfil;
}

/** Conceptos que siguen fallados, del mas urgente al menos. */
function conceptosPendientes(perfil) {
  return Object.entries(perfil.conceptos)
    .filter(([, c]) => c.fallos > c.aciertos)
    .map(([id, c]) => ({ id, ...c }))
    .sort((a, b) => (b.fallos - b.aciertos) - (a.fallos - a.aciertos));
}


/* ===== js/engine/rewardEngine.js ===== */
/**
 * rewardEngine.js — Kamas Clinicas, racha y misiones.
 *
 * DECISIONES ARQUITECTONICAS
 *
 * 1. UNA SOLA MONEDA. El documento proponia XP no gastable ademas de Kamas.
 *    Para una jugadora con examen en fecha fija, dos economias son complejidad
 *    sin funcion. El nivel se deriva de las Kamas ganadas acumuladas.
 *
 * 2. La recompensa NO refleja la nota medica. Se premia haber jugado, haber
 *    enfrentado al tribunal y haber corregido algo que antes fallo. Si solo se
 *    premiara el acierto, el error se volveria castigo y dejaria de jugar.
 *
 * 3. Racha indulgente: un dia libre por semana no la rompe.
 */
const GANANCIAS = {
  completarCaso: 40,
  diagnosticoEsperado: 25,
  completarTribunal: 30,
  porRespuestaCompleta: 5,
  corregirConceptoFallado: 20,
  areaDebil: 15,
  primeraVezDelDia: 25,
  porPreguntaCorrecta: 5,
  rondaCompleta: 15
};
function nivel(kamasGanadasTotal) {
  return Math.max(1, Math.floor(Math.sqrt(kamasGanadasTotal / 60)) + 1);
}
function racha(dias) {
  const set = new Set(dias);
  const d = new Date();
  let n = 0, fallas = 0;
  for (let i = 0; i < 400; i++) {
    const k = d.toLocaleDateString('sv');
    if (set.has(k)) n++;
    else if (i > 0) { fallas++; if (fallas > 1) break; }
    d.setDate(d.getDate() - 1);
  }
  return n;
}

/** Calcula la recompensa de una partida. Devuelve { total, lineas }. */
function recompensar(perfil, caso, resultado, conceptosFalladosAntes) {
  const lineas = [];
  const add = (n, texto) => { if (n > 0) lineas.push({ n, texto }); };

  add(GANANCIAS.completarCaso, 'Caso completado');
  if (resultado.dimensiones.find(d => d.id === 'dx').pct >= 100) {
    add(GANANCIAS.diagnosticoEsperado, 'Diagnostico esperado');
  }
  if (resultado.dimensiones.find(d => d.id === 'tri').total > 0) {
    add(GANANCIAS.completarTribunal, 'Tribunal enfrentado');
    const completas = Math.round(resultado.dimensiones.find(d => d.id === 'tri').n);
    add(completas * GANANCIAS.porRespuestaCompleta, `${completas} respuesta(s) defendidas`);
  }
  const corregidos = resultado.dominados.filter(k => conceptosFalladosAntes.includes(k.id));
  if (corregidos.length) add(corregidos.length * GANANCIAS.corregirConceptoFallado, `${corregidos.length} concepto(s) que antes fallabas`);

  const a = perfil.areas[caso.area];
  if (a && a.partidas > 1 && (a.sumaPuntaje / a.partidas) < 60) add(GANANCIAS.areaDebil, 'Practicaste un area debil');

  if (!perfil.dias.includes(hoy())) add(GANANCIAS.primeraVezDelDia, 'Primera partida del dia');

  const total = lineas.reduce((s, l) => s + l.n, 0);
  return { total, lineas, corregidos: corregidos.length };
}

/** Recompensa de una ronda del banco. Premia terminarla, no solo acertar. */
function recompensarRonda(perfil, resumen) {
  const lineas = [];
  const add = (n, texto) => { if (n > 0) lineas.push({ n, texto }); };
  add(GANANCIAS.rondaCompleta, 'Ronda completada');
  add(resumen.aciertos * GANANCIAS.porPreguntaCorrecta, `${resumen.aciertos} respuesta(s) correctas`);
  if (!perfil.dias.includes(hoy())) add(GANANCIAS.primeraVezDelDia, 'Primera actividad del dia');
  return { total: lineas.reduce((s, l) => s + l.n, 0), lineas };
}

// ---------- misiones ----------
const CATALOGO = [
  { id: 'jugar',     texto: 'Completa un caso',                       meta: 1 },
  { id: 'tribunal',  texto: 'Supera un tribunal completo',            meta: 1 },
  { id: 'defender',  texto: 'Defiende 6 preguntas del tribunal',      meta: 6 },
  { id: 'repaso',    texto: 'Corrige un concepto que antes fallaste', meta: 1 },
  { id: 'provincia', texto: 'Juega un caso en primer nivel',          meta: 1 },
  { id: 'debil',     texto: 'Juega un caso de tu area mas floja',     meta: 1 },
  { id: 'preguntas', texto: 'Completa una ronda de preguntas',        meta: 1 }
];
const RECOMPENSA_MISIONES = 120;
function misionesDeHoy(perfil) {
  const f = hoy();
  if (perfil.misiones?.fecha === f) return perfil.misiones;
  // tres misiones estables por dia, deterministas segun la fecha
  const semilla = [...f].reduce((s, ch) => s + ch.charCodeAt(0), 0);
  const orden = CATALOGO.map((m, i) => ({ m, k: (semilla * (i + 7)) % 97 })).sort((a, b) => a.k - b.k);
  perfil.misiones = {
    fecha: f, cobrada: false,
    lista: orden.slice(0, 3).map(({ m }) => ({ ...m, progreso: 0 }))
  };
  return perfil.misiones;
}
function avanzarMisiones(perfil, evento) {
  const ms = misionesDeHoy(perfil);
  for (const m of ms.lista) {
    if (m.id === evento.tipo) m.progreso = Math.min(m.meta, m.progreso + (evento.cantidad || 1));
  }
  return ms;
}
const misionesCompletas = (ms) => ms.lista.every(m => m.progreso >= m.meta);


/* ===== js/engine/quizEngine.js ===== */
/**
 * quizEngine.js — rondas de preguntas del banco. Sin DOM.
 *
 * DECISIONES ARQUITECTONICAS
 *
 * 1. Opcion multiple con respuesta inmediata. A diferencia del caso clinico,
 *    aqui el error se muestra en el momento: el banco entrena el dato puntual
 *    (una dosis, un umbral, un criterio) y el dato se fija mejor si se corrige
 *    en caliente, con la cita de la norma a la vista.
 *
 * 2. Seleccion sesgada hacia lo que falta, como learningEngine: lo nunca visto
 *    y lo fallado sale mas; lo acertado varias veces seguidas, menos.
 *
 * 3. El orden de las opciones se baraja en cada ronda, para que no se memorice
 *    "era la B" en vez del contenido.
 */
const PREGUNTAS_POR_RONDA = 10;

const diasDesde = (iso) => iso ? Math.floor((Date.now() - new Date(iso + 'T00:00:00').getTime()) / 86400000) : 999;
function pesoPregunta(q, perfil) {
  const r = perfil.preguntas?.[q.id];
  if (!r) return 3;                                   // nunca vista
  let w = 1;
  if (r.fallos > r.aciertos || r.racha === 0) w *= 5; // la ultima vez la fallo
  else if (r.racha >= 3) w *= 0.25;                   // dominada
  if (diasDesde(r.ultima) < 1) w *= 0.3;              // vista hoy
  return w;
}

function barajar(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/** filtro: { area, soloFalladas }. rnd inyectable para pruebas. */
function crearRonda(banco, perfil, filtro = {}, rnd = Math.random) {
  let pool = banco.preguntas.slice();
  if (filtro.area) pool = pool.filter(q => q.area === filtro.area);
  if (filtro.soloFalladas) pool = pool.filter(q => { const r = perfil.preguntas?.[q.id]; return r && r.racha === 0; });
  const n = Math.min(filtro.n || PREGUNTAS_POR_RONDA, pool.length);

  // muestreo ponderado sin reemplazo
  const elegidas = [];
  const restantes = pool.map(q => ({ q, w: pesoPregunta(q, perfil) }));
  while (elegidas.length < n && restantes.length) {
    const total = restantes.reduce((s, x) => s + x.w, 0);
    let t = rnd() * total, k = 0;
    while (k < restantes.length - 1 && (t -= restantes[k].w) > 0) k++;
    elegidas.push(restantes.splice(k, 1)[0].q);
  }

  return {
    filtro,
    inicio: Date.now(),
    preguntas: elegidas.map(q => ({ ...q, orden: barajar(q.opciones.map((_, i) => i), rnd) })),
    i: 0,
    elegida: null,        // indice (en el orden mostrado) de la opcion elegida en la pregunta actual
    respuestas: []        // { id, correcta: bool }
  };
}
const preguntaActual = (ronda) => ronda.preguntas[ronda.i] || null;

/** Registra la respuesta a la pregunta actual. mostrada = indice en el orden barajado. */
function responderPregunta(ronda, perfil, mostrada) {
  const q = preguntaActual(ronda);
  if (!q || ronda.elegida != null) return null;
  const correcta = q.orden[mostrada] === q.correcta;
  ronda.elegida = mostrada;
  ronda.respuestas.push({ id: q.id, correcta });

  perfil.preguntas ||= {};
  const r = perfil.preguntas[q.id] ||= { aciertos: 0, fallos: 0, racha: 0, ultima: null };
  if (correcta) { r.aciertos++; r.racha++; } else { r.fallos++; r.racha = 0; }
  r.ultima = hoy();
  return { correcta, mostradaCorrecta: q.orden.indexOf(q.correcta) };
}
function siguientePregunta(ronda) {
  ronda.i++;
  ronda.elegida = null;
  return preguntaActual(ronda);
}
function resumenRonda(ronda) {
  const aciertos = ronda.respuestas.filter(r => r.correcta).length;
  const falladas = ronda.preguntas.filter(q => ronda.respuestas.some(r => r.id === q.id && !r.correcta));
  return { aciertos, total: ronda.respuestas.length, falladas };
}

/** Para la pantalla de inicio del modulo. */
function estadisticasBanco(banco, perfil) {
  const reg = perfil.preguntas || {};
  const vistas = banco.preguntas.filter(q => reg[q.id]);
  const aciertos = vistas.reduce((s, q) => s + reg[q.id].aciertos, 0);
  const intentos = vistas.reduce((s, q) => s + reg[q.id].aciertos + reg[q.id].fallos, 0);
  return {
    total: banco.preguntas.length,
    vistas: vistas.length,
    dominadas: vistas.filter(q => reg[q.id].racha >= 3).length,
    pendientes: vistas.filter(q => reg[q.id].racha === 0).length,
    pct: intentos ? Math.round(aciertos / intentos * 100) : null
  };
}
