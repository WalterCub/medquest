<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MedQuest</title>
<meta name="description" content="Juego de decisiones clinicas para preparar el examen de grado de medicina en Bolivia. Herramienta educativa: no diagnostica ni sustituye el criterio medico.">
<meta name="theme-color" content="#FF6B4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MedQuest">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700;800;900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
/* =========================================================
   MedQuest — game.css
   Tres familias, cada una con su trabajo:
   Fredoka es la voz del juego (marca, titulos, cifras grandes).
   Nunito es la interfaz (botones, etiquetas, texto corrido).
   Source Serif es la medicina (vineta, hallazgos, preguntas del tribunal,
   citas de la norma). Cuando el texto se vuelve serif, se esta leyendo
   contenido clinico y no interfaz.
   ========================================================= */

:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;

  /* superficies */
  --fondo: #FFF7EC;
  --fondo-2: #FFEFD9;
  --panel: #FFFFFF;
  --panel-2: #FFF6EA;
  --borde: #F1E2CC;
  --borde-fuerte: #E2CBA8;
  --sombra: 0 1px 2px rgba(120, 72, 20, .06), 0 8px 24px rgba(120, 72, 20, .08);
  --sombra-fuerte: 0 2px 4px rgba(120, 72, 20, .08), 0 14px 36px rgba(120, 72, 20, .14);

  /* texto */
  --tinta: #2B2340;
  --tinta-2: #5E5675;
  --tinta-3: #8E86A3;

  /* acentos */
  --coral: #FF6B4A;   --coral-o: #D9472A;
  --sol: #FFC23D;     --sol-o: #D99A12;
  --menta: #19B39E;   --menta-o: #0E8C7B;
  --cielo: #3D8BFD;   --cielo-o: #2166D1;
  --uva: #7B61FF;     --uva-o: #5A40DB;
  --rosa: #F25C9A;    --rosa-o: #CC3B77;
  --oro: #F0A500;

  /* areas */
  --mi: var(--menta);  --mi-o: var(--menta-o);
  --cx: var(--cielo);  --cx-o: var(--cielo-o);
  --go: var(--rosa);   --go-o: var(--rosa-o);
  --pd: #FF8A1F;       --pd-o: #D96A05;
  --sp: #5DBB46;       --sp-o: #3F9A2A;
  --demo: #9A93AE;     --demo-o: #77708C;

  --bien: #2FB86A;  --bien-suave: #E3F7EA;
  --medio: #F0A500; --medio-suave: #FFF2D2;
  --mal: #F0524A;   --mal-suave: #FFE7E4;
  --neutro: #B7AFC8;

  --j: 'Fredoka', 'Nunito', ui-rounded, system-ui, sans-serif;
  --u: 'Nunito', ui-rounded, system-ui, sans-serif;
  --m: 'Source Serif 4', Georgia, serif;
  --radio: 20px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --fondo: #17132E; --fondo-2: #1E1940;
    --panel: #221C47; --panel-2: #2B2458;
    --borde: #372F6B; --borde-fuerte: #4A4188;
    --sombra: 0 1px 2px rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.28);
    --sombra-fuerte: 0 2px 4px rgba(0,0,0,.3), 0 14px 36px rgba(0,0,0,.4);
    --tinta: #F4F1FF; --tinta-2: #C3BCE6; --tinta-3: #8F87B8;
    --bien-suave: #183D34; --medio-suave: #3D3217; --mal-suave: #452029;
    --neutro: #5B528F;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --fondo: #17132E; --fondo-2: #1E1940;
  --panel: #221C47; --panel-2: #2B2458;
  --borde: #372F6B; --borde-fuerte: #4A4188;
  --sombra: 0 1px 2px rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.28);
  --sombra-fuerte: 0 2px 4px rgba(0,0,0,.3), 0 14px 36px rgba(0,0,0,.4);
  --tinta: #F4F1FF; --tinta-2: #C3BCE6; --tinta-3: #8F87B8;
  --bien-suave: #183D34; --medio-suave: #3D3217; --mal-suave: #452029;
  --neutro: #5B528F;
}

*, *::before, *::after { box-sizing: inherit; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; color: var(--tinta);
  background:
    radial-gradient(40rem 22rem at 110% -5%, color-mix(in srgb, var(--sol) 22%, transparent), transparent 70%),
    radial-gradient(34rem 20rem at -15% 30%, color-mix(in srgb, var(--menta) 14%, transparent), transparent 70%),
    var(--fondo);
  background-attachment: fixed;
  font: 500 16px/1.5 var(--u);
  padding-bottom: 6.6rem;
}
h1, h2, h3 { margin: 0; font-family: var(--j); font-weight: 600; letter-spacing: -0.01em; line-height: 1.15; }
h1 { font-size: 1.75rem; }
h2 { font-size: 1.3rem; }
h3 { font-size: 1.08rem; }
p { margin: 0 0 .7em; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button[disabled] { opacity: .45; cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--uva); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.wrap { max-width: 44rem; margin: 0 auto; padding: 0 1rem; }
.clinico { font-family: var(--m); font-size: 1.04rem; line-height: 1.62; font-weight: 400; }

/* ---------- barra superior ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: color-mix(in srgb, var(--fondo) 82%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.top-in { max-width: 44rem; margin: 0 auto; padding: .6rem 1rem; display: flex; align-items: center; gap: .6rem; }
.marca { display: flex; align-items: center; gap: .45rem; font-family: var(--j); font-weight: 600; font-size: 1.2rem; flex: 1 1 auto; }
.marca .logo { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--coral), var(--rosa)); box-shadow: 0 3px 0 var(--coral-o); }
.marca .logo svg { width: 18px; height: 18px; }
.marca em { font-style: normal; color: var(--coral); }
.kc, .mini { display: inline-flex; align-items: center; gap: .3rem; font-family: var(--j); font-weight: 600;
  font-size: .9rem; white-space: nowrap; padding: .28rem .65rem; border-radius: 999px; background: var(--panel); box-shadow: var(--sombra); }
.kc { color: var(--sol-o); }
.kc::before { content: ''; width: .8rem; height: .8rem; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #FFE08A, var(--sol) 60%, var(--sol-o)); }
.mini { color: var(--coral-o); }
.mini:empty { display: none; }
.mini::before { content: '🔥'; font-size: .85rem; }

/* ---------- reloj de partida ---------- */
.reloj-band { background: var(--uva); color: #fff; }
.reloj-in { max-width: 44rem; margin: 0 auto; padding: .45rem 1rem; display: flex; align-items: baseline; gap: .8rem; }
.reloj-in .et { font-size: .82rem; opacity: .85; flex: 1; }
.reloj { font-family: var(--j); font-weight: 600; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.reloj.tarde { color: #FFE08A; }
.reloj.fuera { color: #FFB4AE; }

/* ---------- superficies ---------- */
.panel { background: var(--panel); border: 1px solid var(--borde); border-radius: var(--radio);
  padding: 1.05rem 1.1rem; margin: 0 0 .9rem; box-shadow: var(--sombra); }
.panel.zona { border-top: 6px solid var(--z, var(--borde-fuerte)); }
.hr { height: 2px; background: var(--borde); border: 0; margin: 1rem 0; border-radius: 2px; }
.sutil { color: var(--tinta-2); font-size: .94rem; }
.nota { color: var(--tinta-3); font-size: .85rem; line-height: 1.45; }
.encabezado { padding: 1rem 0 .6rem; }
.encabezado .sutil { margin-top: .3rem; }

.mi { --z: var(--mi); --zo: var(--mi-o); } .cx { --z: var(--cx); --zo: var(--cx-o); } .go { --z: var(--go); --zo: var(--go-o); }
.pd { --z: var(--pd); --zo: var(--pd-o); } .sp { --z: var(--sp); --zo: var(--sp-o); } .demo { --z: var(--demo); --zo: var(--demo-o); }

.pill { display: inline-flex; align-items: center; gap: .3rem; font-size: .76rem; font-weight: 800; letter-spacing: .01em;
  padding: .28rem .65rem; border-radius: 999px; color: #fff; background: var(--z, var(--demo)); }
.pill.gris { background: var(--panel-2); color: var(--tinta-2); border: 1px solid var(--borde); }
.pill.oro { background: var(--sol); color: #4A3200; }

/* ---------- botones ---------- */
.btn { border: 0; background: var(--panel-2); color: var(--tinta); border-radius: 14px;
  padding: .66rem 1rem; font-size: .95rem; font-weight: 800;
  box-shadow: 0 3px 0 var(--borde-fuerte); transition: transform .08s, box-shadow .08s; }
.btn:active:not([disabled]) { transform: translateY(3px); box-shadow: 0 0 0 var(--borde-fuerte); }
.btn.pri { background: var(--coral); color: #fff; box-shadow: 0 4px 0 var(--coral-o); }
.btn.pri:active:not([disabled]) { box-shadow: 0 0 0 var(--coral-o); transform: translateY(4px); }
.btn.verde { background: var(--menta); color: #fff; box-shadow: 0 4px 0 var(--menta-o); }
.btn.uva { background: var(--uva); color: #fff; box-shadow: 0 4px 0 var(--uva-o); }
.btn.sm { padding: .42rem .75rem; font-size: .85rem; border-radius: 11px; }
.btn.act { background: var(--uva); color: #fff; box-shadow: 0 3px 0 var(--uva-o); }
.btn.area { background: var(--z); color: #fff; box-shadow: 0 3px 0 var(--zo); }
.btn.ancho { width: 100%; }
.fila { display: flex; gap: .55rem; flex-wrap: wrap; }
.fila.fin { justify-content: flex-end; }

/* ---------- portada ---------- */
.heroes { display: grid; gap: .8rem; margin-bottom: .9rem; }
@media (min-width: 560px) { .heroes { grid-template-columns: 1.25fr 1fr; } }
.jugar, .hero {
  position: relative; overflow: hidden; display: block; width: 100%; text-align: left; border: 0; color: #fff;
  border-radius: 24px; padding: 1.25rem 1.2rem 1.3rem; min-height: 9.5rem;
  background: linear-gradient(135deg, var(--coral) 0%, #FF8F4A 55%, var(--sol) 120%);
  box-shadow: 0 6px 0 var(--coral-o), var(--sombra-fuerte); transition: transform .1s, box-shadow .1s;
}
.hero.azul { background: linear-gradient(135deg, var(--uva) 0%, var(--cielo) 100%); box-shadow: 0 6px 0 var(--uva-o), var(--sombra-fuerte); }
.jugar:active, .hero:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--coral-o); }
.hero.azul:active { box-shadow: 0 1px 0 var(--uva-o); }
.jugar .k, .hero .k { position: relative; display: block; font-family: var(--j); font-size: 1.75rem; font-weight: 600; line-height: 1.05; }
.jugar .v, .hero .v { position: relative; display: block; font-size: .92rem; font-weight: 700; opacity: .95; margin-top: .35rem; max-width: min(17rem, calc(100% - 6.2rem)); }
.jugar .deco, .hero .deco { position: absolute; right: -.4rem; bottom: -.6rem; width: 6.6rem; height: 6.6rem; opacity: .95; pointer-events: none; }
.jugar .burbuja, .hero .burbuja { position: absolute; border-radius: 50%; background: rgba(255,255,255,.16); pointer-events: none; }

.grid-areas { display: grid; grid-template-columns: repeat(auto-fill, minmax(7.2rem, 1fr)); gap: .55rem; }
.area-btn { border: 0; border-radius: 16px; padding: .75rem .7rem; text-align: left; color: #fff; font-weight: 800;
  background: var(--z); box-shadow: 0 4px 0 var(--zo); transition: transform .08s, box-shadow .08s; }
.area-btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--zo); }
.area-btn .ico { display: block; font-size: 1.35rem; line-height: 1; margin-bottom: .35rem; }
.area-btn small { display: block; font-weight: 700; opacity: .85; font-size: .75rem; margin-top: .1rem; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: .55rem; }
.stat { background: var(--panel-2); border-radius: 16px; padding: .7rem .6rem; text-align: center; }
.stat b { display: block; font-family: var(--j); font-size: 1.45rem; font-weight: 600; line-height: 1.1; }
.stat span { font-size: .76rem; color: var(--tinta-2); font-weight: 700; }

/* ---------- formularios ---------- */
textarea, input[type=text] {
  width: 100%; font: 600 .98rem/1.5 var(--u); color: var(--tinta);
  background: var(--panel-2); border: 2px solid var(--borde); border-radius: 14px;
  padding: .7rem .8rem; resize: vertical; transition: border-color .15s;
}
textarea:focus, input[type=text]:focus { border-color: var(--uva); outline: none; }
textarea { min-height: 5.5rem; }
label.campo { display: block; font-size: .9rem; font-weight: 800; color: var(--tinta-2); margin: 0 0 .4rem; }

/* ---------- chips ---------- */
.chips { display: flex; flex-wrap: wrap; gap: .45rem; margin: .6rem 0 0; }
.chip { display: inline-flex; align-items: center; gap: .4rem; font-size: .88rem; font-weight: 700;
  background: color-mix(in srgb, var(--uva) 14%, var(--panel)); color: var(--tinta);
  border-radius: 999px; padding: .34rem .5rem .34rem .8rem; }
.chip button { background: none; border: 0; color: var(--tinta-3); font-size: 1.05rem; line-height: 1; padding: 0 .15rem; }

/* ---------- listas de hallazgos ---------- */
.hallazgos { list-style: none; margin: .6rem 0 0; padding: 0; }
.hallazgos li { font-family: var(--m); font-weight: 400; font-size: 1.02rem; line-height: 1.55;
  padding: .6rem .1rem .6rem 1.4rem; border-top: 1px dashed var(--borde); position: relative; }
.hallazgos li::before { content: ''; position: absolute; left: .2rem; top: 1.05rem; width: .5rem; height: .5rem; border-radius: 50%; background: var(--z, var(--uva)); }
.hallazgos li:first-child { border-top: 0; }

.sv { width: 100%; border-collapse: separate; border-spacing: 0 .3rem; margin-top: .6rem; font-size: .92rem; }
.sv td { padding: .45rem .7rem; background: var(--panel-2); }
.sv td:first-child { color: var(--tinta-2); border-radius: 10px 0 0 10px; font-weight: 700; }
.sv td:last-child { text-align: right; font-family: var(--j); font-weight: 600; font-variant-numeric: tabular-nums; border-radius: 0 10px 10px 0; }

/* ---------- estudios ---------- */
.estudio { width: 100%; text-align: left; background: var(--panel-2); border: 2px solid var(--borde);
  border-radius: 14px; padding: .65rem .8rem; margin-bottom: .45rem; display: flex; gap: .6rem; align-items: center; font-weight: 700;
  box-shadow: 0 3px 0 var(--borde); transition: transform .08s, box-shadow .08s; }
.estudio:active:not([disabled]) { transform: translateY(3px); box-shadow: none; }
.estudio .nm { flex: 1; font-size: .94rem; }
.estudio.pedido { opacity: 1; border-color: var(--menta); box-shadow: none; }
.estudio .lv { font-size: .72rem; font-weight: 800; color: var(--coral-o); background: var(--mal-suave); border-radius: 999px; padding: .15rem .5rem; }
.resultado { font-family: var(--m); font-weight: 400; font-size: 1rem; line-height: 1.55; color: var(--tinta);
  background: var(--bien-suave); border-radius: 12px; padding: .6rem .8rem; margin: .1rem 0 .7rem; }
.resultado.vacio { background: var(--medio-suave); color: var(--tinta-2); }

/* ---------- tribunal ---------- */
.tribunal { position: relative; overflow: hidden; color: #fff; border-radius: 24px; padding: 1.3rem 1.2rem 1.4rem; margin-bottom: .9rem;
  background: linear-gradient(145deg, #3A2A8C 0%, var(--uva) 70%, var(--rosa) 140%); box-shadow: var(--sombra-fuerte); }
.tribunal .q { position: relative; font-family: var(--m); font-weight: 400; font-size: 1.28rem; line-height: 1.4; margin: .6rem 0 0; }
.tribunal .cuenta { position: relative; display: inline-block; font-size: .76rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase;
  background: rgba(255,255,255,.18); padding: .22rem .6rem; border-radius: 999px; }
.tribunal .jueces { position: absolute; right: .8rem; top: .7rem; font-size: 1.4rem; opacity: .9; letter-spacing: .1rem; }
.explica { background: color-mix(in srgb, var(--uva) 10%, var(--panel)); border: 2px dashed color-mix(in srgb, var(--uva) 45%, transparent); }
.pasos { margin: .5rem 0 0; padding: 0; list-style: none; counter-reset: p; }
.pasos li { position: relative; padding: .35rem 0 .35rem 2.1rem; font-size: .93rem; }
.pasos li::before { counter-increment: p; content: counter(p); position: absolute; left: 0; top: .3rem; width: 1.5rem; height: 1.5rem; border-radius: 50%;
  display: grid; place-items: center; font-family: var(--j); font-size: .85rem; color: #fff; background: var(--uva); }
.esperado { list-style: none; margin: .5rem 0 0; padding: 0; }
.esperado li { font-family: var(--m); font-weight: 400; font-size: 1rem; padding: .4rem .2rem .4rem 1.7rem; position: relative; color: var(--tinta); }
.esperado li::before { content: '✓'; position: absolute; left: .2rem; top: .38rem; width: 1.1rem; height: 1.1rem; border-radius: 50%;
  display: grid; place-items: center; font-size: .7rem; font-weight: 900; color: #fff; background: var(--menta); }
.tu-respuesta { font-family: var(--m); font-weight: 400; background: var(--panel-2); border-radius: 12px; padding: .6rem .8rem; white-space: pre-wrap; }
.autoeval { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; }
.autoeval .btn { padding: .7rem .4rem; }
.autoeval [data-ev="completa"] { background: var(--bien); color: #fff; box-shadow: 0 4px 0 #1E8A4D; }
.autoeval [data-ev="parcial"] { background: var(--sol); color: #4A3200; box-shadow: 0 4px 0 var(--sol-o); }
.autoeval [data-ev="no_supe"] { background: var(--mal); color: #fff; box-shadow: 0 4px 0 #C0342D; }

/* ---------- banco de preguntas ---------- */
.progreso { display: flex; gap: .3rem; margin: .2rem 0 .9rem; }
.progreso i { flex: 1; height: 8px; border-radius: 4px; background: var(--borde); }
.progreso i.ok { background: var(--bien); } .progreso i.no { background: var(--mal); } .progreso i.ahora { background: var(--uva); }
.pregunta { position: relative; overflow: hidden; border-radius: 24px; padding: 1.2rem 1.15rem 1.3rem; margin-bottom: .9rem; color: #fff;
  background: linear-gradient(145deg, var(--z, var(--uva)) 0%, var(--zo, var(--uva-o)) 100%); box-shadow: var(--sombra-fuerte); }
.pregunta .tema { font-size: .78rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; opacity: .9; }
.pregunta .enunciado { font-family: var(--m); font-weight: 400; font-size: 1.22rem; line-height: 1.42; margin: .45rem 0 0; }
.opciones { display: grid; gap: .6rem; margin-bottom: .9rem; }
.opcion { display: flex; align-items: center; gap: .75rem; width: 100%; text-align: left; border: 2px solid var(--borde);
  background: var(--panel); border-radius: 18px; padding: .8rem .9rem; font-weight: 700; font-size: .98rem; line-height: 1.35;
  box-shadow: 0 4px 0 var(--borde); transition: transform .08s, box-shadow .08s, background .15s, border-color .15s; }
.opcion:active:not([disabled]) { transform: translateY(4px); box-shadow: none; }
.opcion .letra { flex: 0 0 auto; width: 2rem; height: 2rem; border-radius: 10px; display: grid; place-items: center;
  font-family: var(--j); font-weight: 600; background: var(--panel-2); color: var(--tinta-2); border: 2px solid var(--borde); }
.opcion[disabled] { cursor: default; opacity: 1; }
.opcion.correcta { background: var(--bien-suave); border-color: var(--bien); box-shadow: 0 4px 0 var(--bien); }
.opcion.correcta .letra { background: var(--bien); border-color: var(--bien); color: #fff; }
.opcion.incorrecta { background: var(--mal-suave); border-color: var(--mal); box-shadow: 0 4px 0 var(--mal); animation: sacudir .35s; }
.opcion.incorrecta .letra { background: var(--mal); border-color: var(--mal); color: #fff; }
.opcion.apagada { opacity: .55; box-shadow: none; }
.veredicto { border-radius: 20px; padding: 1rem 1.05rem; margin-bottom: .9rem; animation: aparecer .25s ease-out; }
.veredicto.bien { background: var(--bien-suave); border: 2px solid var(--bien); }
.veredicto.mal { background: var(--mal-suave); border: 2px solid var(--mal); }
.veredicto h3 { display: flex; align-items: center; gap: .5rem; font-size: 1.25rem; }
.veredicto.bien h3 { color: var(--bien); } .veredicto.mal h3 { color: var(--mal); }
.veredicto p { margin: .45rem 0 0; }
.cita { font-family: var(--m); font-weight: 400; font-size: .98rem; line-height: 1.5; margin: .7rem 0 0; padding: .7rem .85rem;
  background: var(--panel); border-radius: 12px; border-left: 5px solid var(--sol); }
.cita .de { display: block; font-family: var(--u); font-size: .78rem; font-weight: 800; color: var(--tinta-3); margin-top: .4rem; }
.cita a { color: var(--cielo-o); }
.chispas { position: absolute; inset: 0; pointer-events: none; }
.chispas span { position: absolute; font-size: 1.1rem; animation: chispa .9s ease-out forwards; }

@keyframes sacudir { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
@keyframes aparecer { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes chispa { from { opacity: 1; transform: translate(0,0) scale(.6); } to { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.2); } }
@keyframes latido { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }

/* ---------- resultados ---------- */
.puntaje { display: flex; align-items: center; gap: 1.1rem; }
.anillo { --p: 0; --c: var(--mal); flex: 0 0 auto; width: 7.2rem; height: 7.2rem; border-radius: 50%; display: grid; place-items: center;
  background: conic-gradient(var(--c) calc(var(--p) * 1%), var(--panel-2) 0); animation: latido .9s ease-out 1; }
.anillo > div { width: 5.6rem; height: 5.6rem; border-radius: 50%; background: var(--panel); display: grid; place-items: center; text-align: center; }
.anillo b { font-family: var(--j); font-size: 2.1rem; font-weight: 600; line-height: 1; }
.anillo small { display: block; font-size: .72rem; color: var(--tinta-3); font-weight: 800; }
.anillo.b { --c: var(--bien); } .anillo.m { --c: var(--sol); } .anillo.x { --c: var(--mal); }
.mensaje { font-family: var(--j); font-size: 1.2rem; font-weight: 600; line-height: 1.25; }
.global { font-family: var(--j); font-size: 3rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; }
.dim { margin: .75rem 0 0; }
.dim .cab { display: flex; justify-content: space-between; align-items: baseline; font-size: .9rem; font-weight: 800; }
.dim .cab b { font-family: var(--j); font-variant-numeric: tabular-nums; font-weight: 600; }
.barra { height: 12px; border-radius: 6px; background: var(--panel-2); overflow: hidden; margin-top: .3rem; }
.barra > i { display: block; height: 100%; border-radius: 6px; background: var(--neutro); transition: width .6s ease-out; }
.barra > i.b { background: linear-gradient(90deg, #52D38A, var(--bien)); }
.barra > i.m { background: linear-gradient(90deg, #FFD46B, var(--sol)); }
.barra > i.x { background: linear-gradient(90deg, #FF8A82, var(--mal)); }

.repaso { list-style: none; margin: .6rem 0 0; padding: 0; }
.repaso li { padding: .75rem .85rem; margin-top: .5rem; border-radius: 14px; background: var(--panel-2); }
.repaso .en { font-family: var(--m); font-weight: 400; font-size: 1rem; line-height: 1.5; }
.repaso .pq { font-size: .84rem; color: var(--tinta-2); margin-top: .35rem; font-weight: 700; }
.repaso .fu { font-size: .78rem; color: var(--tinta-3); margin-top: .25rem; font-weight: 700; }

details { border-top: 2px solid var(--borde); padding: .7rem 0; }
details > summary { cursor: pointer; font-size: .95rem; font-weight: 800; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: '+'; display: inline-grid; place-items: center; width: 1.3rem; height: 1.3rem; margin-right: .45rem;
  border-radius: 7px; background: var(--panel-2); color: var(--uva); font-weight: 900; }
details[open] > summary::before { content: '–'; }
details .cuerpo { padding-top: .5rem; color: var(--tinta-2); font-size: .93rem; }
details .cuerpo ul { margin: .2rem 0 .5rem; padding-left: 1.15rem; }
details .cuerpo li { margin: .22rem 0; }

.ganancia { display: flex; justify-content: space-between; font-size: .92rem; font-weight: 700; padding: .4rem 0; border-top: 1px dashed var(--borde); }
.ganancia:first-of-type { border-top: 0; }
.ganancia b { font-family: var(--j); color: var(--sol-o); font-variant-numeric: tabular-nums; }

/* ---------- misiones ---------- */
.mision { display: flex; gap: .7rem; align-items: center; padding: .55rem 0; border-top: 1px dashed var(--borde); font-size: .95rem; font-weight: 700; }
.mision:first-of-type { border-top: 0; }
.caja { width: 1.45rem; height: 1.45rem; border: 2.5px solid var(--borde-fuerte); border-radius: 8px; flex: 0 0 auto; position: relative; }
.caja.ok { border-color: var(--bien); background: var(--bien); }
.caja.ok::after { content: '✓'; position: absolute; inset: 0; display: grid; place-items: center; font-size: .85rem; color: #fff; font-weight: 900; }
.mision .pr { font-family: var(--j); font-size: .85rem; color: var(--tinta-3); font-variant-numeric: tabular-nums; }

/* ---------- mapa de areas ---------- */
.areaf { display: flex; align-items: center; gap: .6rem; padding: .7rem 0 .3rem; }
.areaf .nm { flex: 1; font-size: .94rem; font-weight: 700; }
.areaf .n { font-family: var(--j); font-size: .95rem; color: var(--tinta-2); font-variant-numeric: tabular-nums; }

/* ---------- tienda ---------- */
.premio { display: flex; align-items: center; gap: .6rem; padding: .65rem 0; border-top: 1px dashed var(--borde); }
.premio:first-of-type { border-top: 0; }
.premio .nm { flex: 1; font-size: .96rem; font-weight: 700; }
.premio .co { font-family: var(--j); font-weight: 600; color: var(--sol-o); font-variant-numeric: tabular-nums; font-size: .95rem; }

/* ---------- navegacion ---------- */
nav.tabs { position: fixed; left: .7rem; right: .7rem; bottom: calc(.6rem + env(safe-area-inset-bottom, 0px)); z-index: 40; }
.tabs-in { max-width: 30rem; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: .2rem;
  background: var(--panel); border: 1px solid var(--borde); border-radius: 22px; padding: .35rem; box-shadow: var(--sombra-fuerte); }
nav.tabs button { background: none; border: 0; border-radius: 16px; padding: .45rem .2rem .5rem; font-size: .74rem; font-weight: 800;
  color: var(--tinta-3); display: flex; flex-direction: column; align-items: center; gap: .15rem; transition: background .15s, color .15s; }
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-current="page"] { color: #fff; background: var(--coral); }

.pantalla { display: none; }
.pantalla.on { display: block; animation: aparecer .22s ease-out; }
.vacio { color: var(--tinta-3); font-size: .93rem; }
.scroll { overflow-x: auto; }
.aviso { border: 2px solid var(--sol); background: var(--medio-suave); border-radius: 14px; padding: .65rem .8rem; font-size: .88rem; color: var(--tinta-2); margin-bottom: .7rem; }

</style>

<script>window.MEDQUEST_CASOS = [{"id":"DEMO-001","titulo":"La fragua apagada","area":"DEMO","subarea":"Caso de prueba del motor","dificultad":1,"estado":"VALIDADO","tipo":"prueba","nivelesDisponibles":[1],"tiempoSugeridoSeg":420,"notaDeAutoria":"CONTENIDO DE PRUEBA, NO MEDICO. Existe unicamente para validar el ciclo del motor: descubrimiento, registro de decisiones, cierre, tribunal y evaluacion. No contiene ni debe contener informacion clinica.","presentacionInicial":{"texto":"El herrero del pueblo te manda llamar. Su fragua ya no alcanza temperatura: el hierro se pone rojo pero nunca llega al naranja, y desde hace cuatro dias no puede terminar un solo trabajo. El carbon esta encendido y la chimenea tira humo con normalidad.","signosVitales":{"Temperatura maxima alcanzada":"aprox. 750 grados (antes llegaba a 1200)","Tiempo de calentamiento":"45 minutos (antes 12)","Consumo de carbon":"el doble que antes","Tiro de chimenea":"normal"},"contexto":"Taller de herreria, aldea de montana. Te llaman a domicilio y no tienes taller propio ni instrumentos de precision."},"descubrimiento":{"anamnesis":{"etiqueta":"Preguntar al herrero","exigeDeclaracionPrevia":true,"items":[{"clave":"inicio","texto":"Empezo de golpe, un lunes en la manana. El viernes anterior la fragua funcionaba perfecto."},{"clave":"cambios","texto":"Ese fin de semana su sobrino limpio el taller entero y movio cosas de lugar.","critico":true},{"clave":"carbon","texto":"El carbon es del mismo proveedor de siempre, del mismo saco que venia usando antes de la falla."},{"clave":"ruido","texto":"Dice que el fuelle ahora hace un silbido que antes no hacia, sobre todo al empujar.","critico":true},{"clave":"intentos","texto":"Ya probo mas carbon, carbon nuevo, y limpiar la chimenea. Nada cambio."},{"clave":"clima","texto":"No hubo lluvia ni humedad fuera de lo normal esa semana."}]},"examenFisico":{"etiqueta":"Inspeccionar la fragua","exigeDeclaracionPrevia":true,"items":[{"clave":"lecho","texto":"El lecho de carbon esta bien armado y encendido de forma homogenea."},{"clave":"tobera","texto":"La tobera de entrada de aire esta limpia y despejada."},{"clave":"fuelle_ext","texto":"El fuelle se mueve con recorrido completo y sin resistencia anormal."},{"clave":"fuelle_valv","texto":"En la valvula de admision del fuelle hay una grieta de unos tres centimetros en el cuero, por donde se siente salir aire al empujar.","critico":true},{"clave":"chimenea","texto":"La chimenea esta limpia y el humo sube recto."},{"clave":"estructura","texto":"La estructura de ladrillo esta intacta, sin fisuras ni perdidas de calor visibles."}]},"otrosEstudios":{"etiqueta":"Mediciones","items":[{"clave":"flujo_tobera","nombre":"Medir el flujo de aire en la tobera","resultado":"Flujo muy por debajo de lo esperado para el recorrido del fuelle.","nivelMinimo":1},{"clave":"flujo_fuelle","nombre":"Medir el flujo de aire a la salida del fuelle","resultado":"Tambien bajo, y con fuga audible en la admision. La perdida esta en el fuelle, no en el conducto.","nivelMinimo":1},{"clave":"calidad_carbon","nombre":"Probar el carbon en un brasero aparte","resultado":"El carbon alcanza temperatura normal fuera de la fragua.","nivelMinimo":1},{"clave":"temp_lecho","nombre":"Medir temperatura del lecho con pirometro","resultado":"750 grados como maximo, estable, sin picos.","nivelMinimo":1}]}},"estudiosPlausiblesNoIncluidos":[{"nombre":"Analisis quimico del carbon en laboratorio","preguntaTribunal":"Pidio un analisis quimico del carbon. Ya habia probado el carbon en un brasero aparte con resultado normal. Justifique para que pidio el analisis.","comentarioFuente":"El caso de prueba no contempla este estudio."},{"nombre":"Desarmar la estructura de ladrillo de la fragua","preguntaTribunal":"Propuso desarmar la fragua. Explique que hallazgo esperaba y por que no le alcanzaba la inspeccion externa.","comentarioFuente":"El caso de prueba no contempla este estudio."}],"rubrica":{"diagnosticosEsperados":[{"clave":"dx_fuelle","tex iente real ni de un caso publicado. Todo el contenido evaluable (clasificacion, criterios diagnosticos, diferenciales, conducta por nivel de atencion, criterios de referencia y conceptos clave) proviene del capitulo 3 'Asma Bronquial' de la Norma Nacional de Atencion Clinica de Medicina Interna, con la pagina indicada en cada item. Estado BIBLIOGRAFIA_VERIFICADA y no VALIDADO: falta la revision por segunda persona del area antes de usarlo en modo examen. Los nivelMinimo de los estudios se anclan a las normas de caracterizacion de primer nivel (pub. 284, 2013) y de segundo nivel (pub. 285, 2014), en los campos nivelFuente y nivelPagina. En el juego, nivel 1 es el Centro de Salud con Internacion (rural), que segun la norma de primer nivel cuenta con laboratorio basico y sin imagenologia. Oximetria, PEF, prick y metacolina quedan sin anclar: la norma de primer nivel no lista oximetro ni flujometro, y no hay norma de caracterizacion de tercer nivel publicada.","presentacionInicial":{"texto":"Mujer de 26 anos llega caminando al establecimiento de salud, acompanada por su hermana. Desde anoche tiene dificultad para respirar que fue empeorando, tos seca y sensacion de opresion en el pecho. Habla en frases cortas y prefiere quedarse sentada. Su hermana dice que 'le silba el pecho' desde la madrugada.","signosVitales":{"Presion arterial":"118/74 mmHg","Frecuencia cardiaca":"112 lpm","Frecuencia respiratoria":"26 por minuto","Temperatura":"36.8 C","Saturacion de oxigeno":"92% (aire ambiente)"},"contexto":"Puedes jugar este caso en primer, segundo o tercer nivel de atencion. El nivel cambia que estudios estan disponibles y cual es la conducta que la norma espera de ti."},"descubrimiento":{"anamnesis":{"etiqueta":"Interrogar a la paciente","exigeDeclaracionPrevia":true,"items":[{"clave":"sibilancias","texto":"Refiere silbido en el pecho, disnea, tos y opresion toracica. Dice que le pasa 'por temporadas' y que casi siempre empieza de noche o de madrugada.","critico":true},{"clave":"variabilidad","texto":"Los sintomas van y vienen: hay semanas en que no siente nada y otras en que se despierta dos o tres noches ahogada.","critico":true},{"clave":"frecuencia","texto":"En el ultimo mes tuvo sintomas casi todos los dias y se despierta de noche unas dos veces por semana. Ha dejado de subir las gradas rapido porque se agita.","critico":true},{"clave":"desencadenante","texto":"Esta vez empezo despues de limpiar un cuarto cerrado lleno de polvo. Otras veces le pasa con el humo y cuando corre.","critico":true},{"clave":"tratamiento","texto":"Tiene un inhalador de salbutamol que usa 'cuando le falta el aire', unas cuatro o cinco veces al dia en las malas semanas. Nunca uso inhalador de mantenimiento.","critico":true},{"clave":"rescates_hoy","texto":"Desde anoche se aplico el salbutamol seis veces y cada vez le alivia menos."},{"clave":"hospitalizaciones","texto":"Nunca estuvo internada ni intubada por esto. Ha ido dos veces a emergencias en el ultimo ano."},{"clave":"fiebre_expec","texto":"No tiene fiebre, escalofrios ni expectoracion purulenta."},{"clave":"embarazo","texto":"Ultima menstruacion hace dos semanas. No esta embarazada ni sospecha estarlo."},{"clave":"cardio","texto":"No tiene ortopnea previa, no tiene edema de piernas, no ha tenido dolor toracico ni palpitaciones fuera de las crisis."}]},"antecedentes":{"etiqueta":"Antecedentes","exigeDeclaracionPrevia":true,"items":[{"clave":"atopia","texto":"Rinitis alergica desde la adolescencia y eczema en la infancia. La madre tambien es asmatica.","critico":true},{"clave":"tabaco","texto":"No fuma. En su casa se cocina con gas y no hay fumadores.","critico":true},{"clave":"aines","texto":"No refiere reacciones a antiinflamatorios ni a aspirina."},{"clave":"ocupacion","texto":"Trabaja en una tienda. En su cuarto hay alfombra y tiene dos gatos."},{"clave":"comorbilidad","texto":"Sin diabetes, sin hipertension, sin cardiopatia conocida. Indice de masa corporal 24."}]},"examenFisico":{"etiqueta":"Examinar a la paciente","exigeDeclaracionPrevia":true,"items":[{"clave":"general","texto":"Consciente, orientada, ansiosa. Prefiere estar sentada. Habla en frases cortas, no en palabras aisladas."},{"clave":"auscultacion","texto":"Roncus y sibilancias audibles en ambas fases de la respiracion, difusos en ambos campos. Espiracion prolongada.","critico":true},{"clave":"accesorios","texto":"Usa musculos accesorios del cuello. Aleteo nasal leve. No hay tiraje intercostal marcado.","critico":true},{"clave":"percusion","texto":"Percusion con hiperresonancia difusa, sin matidez localizada."},{"clave":"cardio_ex","texto":"Taquicardia regular sin soplos. No hay ingurgitacion yugular ni reflujo hepatoyugular. Sin edema de miembros inferiores.","critico":true},{"clave":"cuello","texto":"Traquea centrada. No hay estridor inspiratorio ni disfonia."},{"clave":"piel","texto":"Sin cianosis. Llenado capilar normal. Piel tibia."},{"clave":"conciencia","texto":"Escala de conciencia normal, sin somnolencia ni confusion."}]},"laboratorio":{"etiqueta":"Laboratorio","items":[{"clave":"hemograma","nombre":"Hemograma completo","resultado":"Leucocitos 8.900 con eosinofilia leve. Sin desviacion izquierda.","nivelMinimo":1,"fuente":0,"nivelFuente":1,"nivelPagina":"37, 121","nivelNota":"La norma de primer nivel asigna laboratorio basico al Centro de Salud con Internacion, con analizador hematologico, contador diferencial y lector de hematocrito.","nivelAnclaje":"COMPLETO"},{"clave":"ige","nombre":"IgE serica","resultado":"Elevada.","nivelMinimo":2,"fuente":0,"nivelFuente":2,"nivelPagina":"77","nivelNota":"El laboratorio basico de primer nivel no lista equipo para determinar IgE (norma de primer nivel, p. 121). El hospital de segundo nivel tiene servicio de laboratorio (p. 77), pero el detalle de pruebas esta en el cap. XIII, aun no descargado.","nivelAnclaje":"PARCIAL"},{"clave":"esputo","nombre":"Examen de esputo","resultado":"Escaso, con eosinofilos. No se observan bacterias en el Gram.","nivelMi lina","nombre":"Prueba de broncoconstriccion con metacolina","resultado":"No se realiza: esta contraindicada durante la crisis y ademas la espirometria ya mostro obstruccion reversible.","nivelMinimo":3,"fuente":0}]}},"estudiosPlausiblesNoIncluidos":[{"nombre":"Dimero D o angiotomografia de torax por sospecha de tromboembolismo pulmonar","preguntaTribunal":"Solicito estudios por sospecha de tromboembolismo pulmonar. El tromboembolismo esta en el diagnostico diferencial de la fuente para este grupo de edad. Diga que datos del caso lo hicieron sospecharlo y que datos lo alejan.","comentarioFuente":"La fuente incluye el tromboembolismo pulmonar entre los diferenciales a sospechar entre los 15 y 40 anos, pero el caso no contempla resultados para estos estudios.","fuente":0},{"nombre":"Gasometria arterial","preguntaTribunal":"Pidio gasometria arterial. Explique que decision clinica habria cambiado segun el resultado, y con que datos de la cabecera estaba evaluando la gravedad mientras esperaba.","comentarioFuente":"El capitulo de asma de la fuente no la lista entre los examenes complementarios del diagnostico de asma; el caso no contempla su resultado.","fuente":0},{"nombre":"Electrocardiograma","preguntaTribunal":"Solicito electrocardiograma. Justifique la indicacion en esta paciente y diga que estaba descartando.","comentarioFuente":"El caso no contempla su resultado.","fuente":0},{"nombre":"Hemocultivos","preguntaTribunal":"Pidio hemocultivos. Diga que cuadro estaba considerando y si los datos del caso lo sostienen.","comentarioFuente":"El caso no contempla su resultado.","fuente":0}],"rubrica":{"diagnosticosEsperados":[{"clave":"dx_crisis","texto":"Crisis asmatica (exacerbacion de asma bronquial). La fuente clasifica el tratamiento de la crisis en leve, moderada y grave, y ubica la crisis moderada y la leve en segundo y tercer nivel de atencion","valoracion":"ESPERADO","fuente":0,"pagina":"49-50","sinonimos":["crisis asmatica","exacerbacion asmatica","crisis de asma" uccion e inmovilizacion","reduccion bajo anestesia local","manipulacion"],"conceptoLigado":"c_tratamiento"},{"clave":"cx_yeso","texto":"Inmovilizacion con aparato de yeso o ferula. La fuente indica usarlo durante 6 a 8 semanas en la fractura no desplazada, seguido de fisioterapia","valoracion":"ESPERADO","fuente":0,"pagina":"60-61","nivel":[2,3],"sinonimos":["yeso","aparato de yeso","ferula","inmovilizacion con yeso","bota de yeso","valva"],"conceptoLigado":"c_tratamiento"},{"clave":"cx_fisioterapia","texto":"Terapia fisica despues de la inmovilizacion para restaurar fuerza y movilidad","valoracion":"ACEPTABLE","fuente":0,"pagina":"60","nivel":[2,3],"sinonimos":["fisioterapia","terapia fisica","rehabilitacion"],"conceptoLigado":"c_tratamiento"},{"clave":"cx_informar","texto":"Informar a la paciente sobre su condicion, la gravedad, el tiempo de tratamiento, los procedimientos con sus riesgos y beneficios, y la necesidad de referir si corresponde","valoracion":"ACEPTABLE","fuente":0,"pagina":"61","nivel":[1,2,3],"sinonimos":["informar","explicar","consentimiento","orientacion"]},{"clave":"cx_prevencion","texto":"Prevencion: dieta rica en calcio y vitamina D, ejercicio, prevencion de caidas (iluminacion, pasamanos, calzado antideslizante) y evaluacion de la salud osea en mayores de 65 anos con factores de riesgo de osteoporosis","valoracion":"ACEPTABLE","fuente":0,"pagina":"61","nivel":[1,2,3],"sinonimos":["calcio","vitamina d","prevencion de caidas","pasamanos","osteoporosis","salud osea"],"conceptoLigado":"c_prevencion"},{"clave":"cx_cirugia","texto":"Reduccion abierta y fijacion con osteosintesis. La fuente la reserva para fracturas intraarticulares, extraarticulares con criterios de inestabilidad y fracturas expuestas; esta fractura es extraarticular, cerrada y sin conminucion","valoracion":"NO_CONTEMPLADO_POR_LA_FUENTE","fuente":0,"pagina":"60-61","nivel":[2,3],"sinonimos":["cirugia","reduccion abierta","osteosintesis","placa","fijacion interna","fijador externo","operar"],"conceptoLigado":"c_tratamiento"},{"clave":"cx_antibiotico","texto":"Antibiotico profilactico en primer nivel. La fuente indica antibiotico en dosis unica antes de referir solo en la fractura expuesta; esta fractura es cerrada","valoracion":"NO_CONTEMPLADO_POR_LA_FUENTE","fuente":0,"pagina":"60","nivel":[1],"sinonimos":["antibiotico","cefazolina","cefotaxima","profilaxis antibiotica"],"conceptoLigado":"c_primer_nivel"}],"informacionCritica":[{"clave":"mecanismo","texto":"Mecanismo: caida con la mano extendida y la muneca en extension, la causa mas comun y la que produce la fractura de Colles","valoracion":"ESPERADO","fuente":0,"pagina":"59","conceptoLigado":"c_mecanismos"},{"clave":"sintomas","texto":"Dolor, aumento de volumen e impotencia funcional","valoracion":"ESPERADO","fuente":0,"pagina":"59","conceptoLigado":"c_diagnostico"},{"clave":"parestesias","texto":"Sintomas neurologicos distales: las lesiones neurovasculares asociadas son criterio de referencia","valoracion":"ESPERADO","fuente":0,"pagina":"61","conceptoLigado":"c_referencia"},{"clave":"osteoporosis","texto":"Factores de riesgo de osteoporosis, que la fuente lista como causa de fractura distal de radio por lesiones menores","valoracion":"ESPERADO","fuente":0,"pagina":"59, 61","conceptoLigado":"c_prevencion"},{"clave":"deformidad","texto":"Deformidad, inestabilidad y sensibilidad en la zona afectada al examen fisico","valoracion":"ESPERADO","fuente":0,"pagina":"59","conceptoLigado":"c_diagnostico"},{"clave":"piel","texto":"Integridad de la piel: define si la fractura es cerrada o expuesta, que cambia la conducta de primer nivel","valoracion":"ESPERADO","fuente":0,"pagina":"60","conceptoLigado":"c_primer_nivel"},{"clave":"neurovascular","texto":"Estado neurovascular distal: las lesiones neurovasculares asociadas son criterio de referencia","valoracion":"ESPERADO","fuente":0,"pagina":"61","conceptoLigado":"c_referencia"}],"conceptosClave":[{"id":"c_definicion","enunciado":"La fractura distal del radio (S52.5) es una solucion de continuidad osea de la metafisis y la epifisis distal del radio; incluye las fracturas de Colles y de Smith.","fuente":0,"pagina":"58"},{"id":"c_mecanismos","enunciado":"Colles: la mas frecuente, caida con la muneca en extension. Smith (Colles invertido): extraarticular, caida con la muneca en flexion. Rhea-Barton: intraarticular por cizallamiento. Hutchinson: intraarticular por cizallamiento de la estiloides radial. Die-punch: intraarticular por compresion axial del semilunar.","fuente":0,"pagina":"59"},{"id":"c_clasificacion","enunciado":"Clasificacion Muller-AO: tipo A extraarticular, tipo B intraarticular parcial, tipo C intraarticular completa. La fuente tambien describe Frykman (8 grupos) y Fernandez (5 grupos por mecanismo).","fuente":0,"pagina":"58-59"},{"id":"c_diagnostico","enunciado":"El diagnostico se hace con la evaluacion clinica y la radiografia simple, que es la prueba de imagen inicial de eleccion: anteroposterior y lateral de muneca. La tomografia ayuda en las fracturas intraarticulares y para planificar la cirugia.","fuente":0,"pagina":"59-60"},{"id":"c_primer_nivel","enunciado":"Primer nivel: fractura cerrada, inmovilizacion y referencia a segundo o tercer nivel. Fractura expuesta: cubrir con aposito esteril, inmovilizacion provisional, paracetamol 1 g VO y antibiotico en dosis unica antes de referir.","fuente":0,"pagina":"60"},{"id":"c_tratamiento","enunciado":"Segundo y tercer nivel: fractura estable, reduccion incruenta e inmovilizacion con yeso; fractura inestable o expuesta, reduccion abierta y osteosintesis o fijacion externa. Despues, fisioterapia.","fuente":0,"pagina":"60-61"},{"id":"c_referencia","enunciado":"Criterios de referencia: tratamiento quirurgico, fractura expuesta, inestable, desplazada o con lesiones neurovasculares asociadas. Alta: ausencia de complicaciones. Contrarreferencia: alta de traumatologia para seguimiento y rehabilitacion.","fuente":0,"pagina":"61"},{"id":"c_prevencion","enunciado":"La fuente advierte riesgo futuro de artrosis postraumatica y recomienda dieta con calcio y vitamina D, ejercicio, prevencion de caidas y evaluacion de la salud osea en mayores de 65 anos con factores de riesgo de osteoporosis.","fuente":0,"pagina":"61"}]},"tribunal":[{"id":"t01","pregunta":"Diga su diagnostico y con que datos de la anamnesis y el examen lo sostiene.","disparador":{"tipo":"siempre"},"loQueSeEsperaOir":["Fractura distal del radio, probable Colles","Caida con la mano extendida y la muneca en extension","Dolor, aumento de volumen e impotencia funcional","Deformidad con desviacion dorsal","Fractura cerrada, sin compromiso neurovascular"],"conceptoLigado":"c_definicion","fuente":0},{"id":"t02","pregunta":"Como distingue por el mecanismo una fractura de Colles de una de Smith? Nombre las otras variantes que describe la fuente.","disparador":{"tipo":"siempre"},"loQueSeEsperaOir":["Colles: caida con la muneca en extension, la mas frecuente","Smith: caida con la muneca en flexion, Colles invertido","Rhea-Barton, Hutchinson, die-punch y avulsiones"],"conceptoLigado":"c_mecanismos","fuente":0},{"id":"t03","pregunta":"Esta en un Centro de Salud con Internacion, sin rayos X. Que hace con esta paciente, en que orden, y a donde la envia?","disparador":{"tipo":"siempre"},"loQueSeEsperaOir":["Inmovilizacion provisional","Analgesico: paracetamol 1 g via oral dosis unica","Referencia a segundo o tercer nivel","Fractura cerrada: no requiere antibiotico"],"conceptoLigado":"c_primer_nivel","fuente":0},{"id":"t04","pregunta":"Suponga que el hueso asomaba por una herida. Que cambia en su conducta de primer nivel?","disparador":{"tipo":"siempre"},"loQueSeEsperaOir":["Cubrir con aposito esteril","Inmovilizacion provisional","Paracetamol 1 g","Antibiotico en dosis unica: cefazolina, o cefotaxima 1 g IV si esta canalizada","Referencia a segundo o tercer nivel"],"conceptoLigado":"c_primer_nivel","fuente":0},{"id":"t05","pregunta":"Pidio radiografia. Que proyecciones, y que le tiene que decir la placa para decidir el tratamiento?","disparador":{"tipo":"siPidio","clave":"rx_muneca"},"loQueSeEsperaOir":["Anteroposterior y lateral de muneca","Confirma la fractura, su ubicacion y gravedad","Si es intra o extraarticular","Si esta desplazada o es inestable"],"conceptoLigado":"c_diagnostico","fuente":0},{"id":"t06","pregunta":"No pidio radiografia. Como decide entre yeso, reduccion cerrada o cirugia sin ella?","disparador":{"tipo":"siNoPidio","clave":"rx_muneca"},"loQueSeEsperaOir":["No se puede: la radiografia simple es la prueba inicial de eleccion","Define si es intra o extraarticular, desplazada o inestable"],"conceptoLigado":"c_diagnostico","fuente":0},{"id":"t07","pregunta":"Clasifique esta fractura con la clasificacion AO y diga que significa cada tipo.","disparador":{"tipo":"siempre"},"loQueSeEsperaOir":["Tipo A: extraarticular (esta paciente)","Tipo B: intraarticular parcial","Tipo C: intraarticular completa"],"conceptoLigado":"c_clasificacion","fuente":0},{"id":"t08","pregunta":"Propuso cirugia con osteosintesis. En que fracturas la reserva la fuente, y esta paciente cumple esos criterios?","disparador":{"tipo":"siConducta","clave":"cx_cirugia"},"loQueSeEsperaOir":["Intraarticulares","Extraarticulares con criterios de inestabilidad","Expuestas","Esta fractura es extraarticular, cerrada y sin conminucion: reduccion cerrada y yeso"],"conceptoLigado":"c_tratamiento","fuente":0},{"id":"t09","pregunta":"La fractura esta desplazada y usted no propuso reducirla. Justifique.","disparador":{"tipo":"siNoConducta","clave":"cx_reduccion_cerrada"},"loQueSeEsperaOir":["Extraarticular desplazada: reduccion cerrada y luego yeso o ferula","Fractura estable: tratamiento conservador con reduccion incruenta"],"conceptoLigado":"c_tratamiento","fuente":0},{"id":"t10","pregunta":"Indico antibiotico en primer nivel. En que situacion lo indica la fuente antes de referir?","disparador":{"tipo":"siConducta","clave":"cx_antibiotico"},"loQueSeEsperaOir":["Solo en fractura expuesta","Esta fractura es cerrada"],"conceptoLigado":"c_primer_nivel","fuente":0},{"id":"t11","pregunta":"Estando en primer nivel no propuso referir. Justifique frente a la fuente.","disparador":{"tipo":"siNoConducta","clave":"cx_referir"},"loQueSeEsperaOir":["Fractura cerrada en primer nivel: inmovilizacion y referencia a II o III nivel","La fractura desplazada es criterio de referencia"],"conceptoLigado":"c_referencia","fuente":0},{"id":"t12","pregunta":"No evaluo pulso, llenado capilar ni sensibilidad de la mano. Por que era obligatorio?","disparador":{"tipo":"siOmitioInfo","clave":"neurovascular"},"loQueSeEsperaOir":["Las lesiones neurovasculares asociadas son criterio de referencia","Cambian la urgencia y el tratamiento"],"conceptoLigado":"c_referencia","fuente":0},{"id":"t13","pregunta":"No reviso la piel sobre la fractura. Que dato perdio?","disparador":{"tipo":"siOmitioInfo","clave":"piel"},"loQueSeEsperaOir":["Si la fractura es cerrada o expuesta","La expuesta cambia la conducta de primer nivel: aposito esteril y antibiotico en dosis unica"],"conceptoLigado":"c_primer_nivel","fuente":0},{"id":"t14","pregunta":"No pregunto por antecedentes que sugieran huesos fragiles. Por que importa en esta paciente?","disparador":{"tipo":"siOmitioInfo","clave":"osteoporosis"},"loQueSeEsperaOir":["La osteoporosis es causa de fractura distal de radio por lesiones menores","Mayor de 65 anos con factores de riesgo: evaluar la salud osea"],"conceptoLigado":"c_prevencion","fuente":0},{"id":"t15","pregunta":"Enumere los criterios de referencia de la fractura distal del radio segun la fuente.","disparador":{"tipo":"siempre"},"loQueSeEsperaOir":["Para tratamiento quirurgico","Fractura expuesta","Inestable","Desplazada","Con lesiones neurovasculares asociadas"],"conceptoLigado":"c_referencia","fuente":0},{"id":"t16","pregunta":"La paciente pregunta cuanto tiempo va a tener el yeso y que viene despues. Que le responde?","disparador":{"tipo":"siempre"},"loQueSeEsperaOir":["Yeso o ferula durante 6 a 8 semanas","Despues fisioterapia para recuperar fuerza y movilidad","Riesgo futuro de artrosis postraumatica"],"conceptoLigado":"c_tratamiento","fuente":0},{"id":"t17","pregunta":"Es su segunda caida del ano y tiene gradas sin pasamanos. Que le indica para prevenir otra fractura?","disparador":{"tipo":"siempre"},"loQueSeEsperaOir":["Dieta con calcio y vitamina D","Ejercicio de fuerza y equilibrio","Prevencion de caidas: iluminacion, pasamanos, calzado antideslizante","Evaluacion de la salud osea por ser mayor de 65 con factores de riesgo"],"conceptoLigado":"c_prevencion","fuente":0}],"fuentes":[{"institucion":"Estado Plurinacional de Bolivia. Ministerio de Salud y Deportes. Direccion General de Redes de Servicios de Salud, Unidad de Redes de Servicios de Salud y Calidad, Area del Continuo","documento":"Norma Nacional de Atencion Clinica de Traumatologia. Serie: Documentos Tecnico Normativos No. 542. La Paz: Industrias Graficas Platinium. 108 p. Deposito legal 4-1-744-2025 P.O.","anio":"2025","publicacion":"542","resolucion":"RM 0456 de 30 de septiembre de 2025","capitulo":"11. Fractura Distal del Radio (CIE-10 S52.5). Nivel de atencion I - II - III","pagina":"58-61","url":"https://www.minsalud.gob.bo/8850-norma-nacional-de-atencion-clinica-nnac","consultado":"2026-09-22"},{"institucion":"Estado Plurinacional de Bolivia. Ministerio de Salud y Deportes. Direccion General de Servicios de Salud, Unidad de Redes de Servicios de Salud y Calidad","documento":"Norma Nacional de Caracterizacion de Establecimientos de Salud de Primer Nivel. 2da edicion. Serie: Documentos Tecnico Normativos No. 284. La Paz: Talleres Graficos Tupac Katari. 240 p.","anio":"2013","publicacion":"284","capitulo":"Cap. II, Cuadro No 5 Caracteristicas generales","pagina":"35-40","url":"https://www.minsalud.gob.bo/images/Documentacion/redes_salud/Inivelseguro.pdf","consultado":"2026-09-22"},{"institucion":"Estado Plurinacional de Bolivia. Ministerio de Salud y Deportes. Unidad de Redes de Servicios de Salud y Calidad","documento":"Norma Nacional de Caracterizacion de Hospitales de Segundo Nivel. Serie: Documentos Tecnico Normativos No. 285. La Paz.","anio":"2014","publicacion":"285","capitulo":"Cap. IV Caracterizacion General del Hospital de Segundo Nivel","pagina":"77, 102","url":"https://www.minsalud.gob.bo/images/Documentacion/redes_salud/CAP-4.pdf","consultado":"2026-09-22"}]},{"id":"URG-016","titulo":"Joven que tomo veneno para plagas","area":"MI","subarea":"Urgencias: intoxicacion aguda por inhibidor de colinesterasa","dificultad":3,"estado":"BORRADOR","tipo":"medico","nivelesDisponibles":[1,2,3],"tiempoSugeridoSeg":1800,"notaDeAutoria":"La vineta clinica y los resultados de estudios los redacto el autor del caso para que apliquen los criterios de la fuente; NO provienen de un paciente real ni de un caso publicado. Todo el contenido evaluable (definicion de caso sospechoso, manifestaciones, examenes, diferenciales, medidas por nivel, descontaminacion, antidotos, criterios de referencia y alta, prevencion) proviene del capitulo 16 'Intoxicacion Aguda por Inhibidor de Colinesterasa' de la Norma Nacional de Atencion Clinica de Urgencias y Emergencias (fuente 0), con la pagina indicada en cada item. La tabla de antidotos de la fuente (p. 151) esta desalineada en el PDF: se tomo la dosis de atropina, la de oximas y la frase 'no esta indicada por el alto volumen de distribucion' como referida a la hemodialisis; conviene confirmarlo en el impreso. Los nivelMinimo de los estudios se anclan a las normas de caracterizacion de primer nivel (fuente 1) y segundo nivel (fuente 2); en el juego, nivel 1 es el Centro de Salud con Internacion. Estado BORRADOR: falta verificar cada pagina contra el PDF y la revision por una segunda persona del area.","presentacionInicial":{"texto":"Varon de 19 anos traido por su madre. Hace unos 40 minutos, despues de una discusion en casa, tomo un liquido de una botella de insecticida que usan en la chacra. Vomito dos veces en el camino. Esta sudoroso, babea y dice que ve borroso. La madre trae la botella en una bolsa.","signosVitales":{"Presion arterial":"90/60 mmHg","Frecuencia cardiaca":"48 lpm","Frecuencia respiratoria":"28 por minuto","Temperatura":"35.9 C","Saturacion de oxigeno":"88% (aire ambiente)"},"contexto":"Puedes jugar este caso en primer, segundo o tercer nivel de atencion. El nivel cambia que estudios estan disponibles y cual es la conducta que la norma espera de ti."},"descubrimiento":{"anamnesis":{"etiqueta":"Interrogar al paciente y a la madre","exigeDeclaracionPrevia":true,"items":[{"clave":"producto","texto":"La etiqueta de la botella dice 'Clorpirifos'. Es un insecticida que su padre usa para la papa.","critico":true},{"clave":"tiempo","texto":"Lo tomo hace unos 40 minutos. La madre calcula que fue 'un trago grande'.","critico":true},{"clave":"via","texto":"Lo tomo por la boca. Al tomarlo se le chorreo sobre la camisa, que todavia tiene puesta y huele a quimico.","critico":true},{"clave":"intencion","texto":"Al preguntarle a solas, dice que lo tomo porque 'ya no queria seguir'. Es la primera vez que hace algo asi.","critico":true},{"clave":"sintomas_gi","texto":"Tiene nauseas, vomito dos veces, colicos y una deposicion liquida en el camino.","critico":true},{"clave":"otros_toxicos","texto":"Niega haber tomado alcohol, medicamentos u otro producto."}]},"antecedentes":{"etiqueta":"Antecedentes","exigeDeclaracionPrevia":true,"items":[{"clave":"psiquiatrico","texto":"La madre cuenta que en los ultimos meses esta aislado y duerme mal. Nunca fue atendido por psicologia ni psiquiatria."},{"clave":"alergias","texto":"No tiene alergias conocidas a medicamentos."},{"clave":"comorbilidad","texto":"Sano. No toma ningun medicamento. Vacunas al dia segun la madre."}]},"examenFisico":{"etiqueta":"Examinar al paciente","exigeDeclaracionPrevia":true,"items":[{"clave":"conciencia","texto":"Despierto, ansioso, responde a ordenes. Glasgow 15/15. No convulsiona.","critico":true},{"clave":"pupilas","texto":"Miosis bilateral puntiforme. Lagrimeo abundante.","critico":true},{"clave":"secreciones","texto":"Sialorrea abundante. Sudoracion profusa en todo el cuerpo.","critico":true},{"clave":"pulmones","texto":"Crepitantes y roncus difusos en ambos campos por abundantes secreciones bronquiales. Sibilancias espiratorias.","critico":true},{"clave":"musculos","texto":"Fasciculaciones en parpados, cara y musculos del torax. Fuerza muscular disminuida en las cuatro extremidades.","critico":true},{"clave":"cardio_ex","texto":"Bradicardia regular. Pulsos perifericos debiles. Llenado capilar de 3 segundos."},{"clave":"piel_ropa","texto":"Camisa humeda con el producto en el pecho. Piel del torax sin lesiones visibles."}]},"laboratorio":{"etiqueta":"Laboratorio","items":[{"clave":"hemograma","nombre":"Hemograma","resultado":"Leucocitos 13.200/mm3. Hematocrito 46%. Plaquetas normales.","nivelMinimo":1,"fuente":0,"nivelFuente":1,"nivelPagina":"37, 121","nivelNota":"La norma de primer nivel asigna laboratorio basico al Centro de Salud con Internacion, con analizador hematologico, contador diferencial y lector de hematocrito.","nivelAnclaje":"COMPLETO"},{"clave":"bioquimica","nombre":"Glucemia, urea y creatinina","resultado":"Glucemia 186 mg/dl. Urea 30 mg/dl. Creatinina 0.9 mg/dl.","nivelMinimo":2,"fuente":0,"nivelFuente":1,"nivelPagina":"121, 204","nivelNota":"El laboratorio basico del Centro de Salud con Internacion no lista equipo de bioquimica (norma de primer nivel, p. 121); la bioquimica aparece en el laboratorio completo del Centro de Salud Integral (p. 204). Falta confirmar el detalle en la norma de segundo nivel (cap. XIII, aun no descargado).","nivelAnclaje":"PARCIAL"},{"clave":"colinesterasa","nombre":"Colinesterasa plasmatica","resultado":"Actividad marcadamente disminuida respecto del rango normal del laboratorio (1020-3460 U/L).","nivelMinimo":2,"fuente":0},{"clave":"amilasa","nombre":"Amilasa","resultado":"Dentro de valores normales.","n
