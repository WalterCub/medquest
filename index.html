<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MedQuest</title>
<meta name="description" content="Juego de decisiones clinicas para preparar el examen de grado de medicina en Bolivia. Herramienta educativa: no diagnostica ni sustituye el criterio medico.">
<meta name="theme-color" content="#FF6B4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MedQuest">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700;800;900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/game.css">
</head>
<body>

<header class="top">
  <div class="top-in">
    <span class="marca"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.5-6 5 12L17 12h4"/></svg></span><span>Med<em>Quest</em></span></span>
    <span class="mini" id="racha"></span>
    <span class="kc" id="kc">0 KC</span>
  </div>
</header>

<div class="reloj-band" id="reloj-band" style="display:none">
  <div class="reloj-in">
    <span class="et">Tiempo de la partida</span>
    <span class="reloj" id="reloj">30:00</span>
  </div>
</div>

<main class="wrap">
  <section class="pantalla on" id="p-inicio"></section>
  <section class="pantalla" id="p-partida"></section>
  <section class="pantalla" id="p-tribunal"></section>
  <section class="pantalla" id="p-resultado"></section>
  <section class="pantalla" id="p-perfil"></section>
  <section class="pantalla" id="p-tienda"></section>
  <section class="pantalla" id="p-preguntas"></section>
  <section class="pantalla" id="p-avatar"></section>
</main>

<nav class="tabs">
  <div class="tabs-in">
    <button data-ir="inicio" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l7-7 7 7"/><path d="M7 11v8h10v-8"/></svg>
      Jugar</button>
    <button data-ir="preguntas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5V14"/><path d="M12 17.5h.01"/></svg>
      Preguntas</button>
    <button data-ir="perfil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h6v6H4zM14 5h6v6h-6zM4 13h6v6H4zM14 13h6v6h-6z"/></svg>
      Mapa</button>
    <button data-ir="avatar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="5"/><path d="M5 21c.8-3.6 3.6-6 7-6s6.2 2.4 7 6"/><path d="M9 14.5l3 3 3-3"/></svg>
      Personaje</button>
    <button data-ir="tienda">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M9.5 10.2c0-1 1.1-1.7 2.5-1.7s2.5.6 2.5 1.6c0 2.2-5 1.3-5 3.4 0 1 1.1 1.6 2.5 1.6s2.5-.7 2.5-1.7"/></svg>
      Canje</button>
  </div>
</nav>

<script type="module" src="js/app.js"></script>
</body>
</html>
